<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000">
<title>ProClub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0A0A0A;--bg2:#1A1A1A;--bg3:#2A2A2A;--text:#F5F5F7;--text2:#AEAEB2;--text3:#636366;--gold:#C8A84B;--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.12);--green:#30D158;--red:#FF453A;--blue:#0A84FF;--purple:#BF5AF2;--orange:#FF9F0A;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
html,body{height:100%;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.screen{display:none;flex-direction:column;height:100dvh;overflow:hidden}
.screen.on{display:flex}
#s-load{align-items:center;justify-content:center;gap:20px;background:#000}
.pc-logo{width:72px;height:72px;border-radius:18px;background:rgba(200,168,75,.1);border:1px solid rgba(200,168,75,.25);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--gold);letter-spacing:1px;overflow:hidden}
.pc-logo img{width:100%;height:100%;object-fit:cover;display:none}
.spin{width:24px;height:24px;border:2px solid rgba(255,255,255,.1);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#s-login{background:#000;position:relative;overflow:hidden;align-items:center;justify-content:center;padding:32px 24px;gap:28px;padding-top:calc(32px + var(--st));padding-bottom:calc(32px + var(--sb))}
.login-bg{position:absolute;inset:0;background:radial-gradient(ellipse 70% 40% at 50% 0%,rgba(200,168,75,.1) 0%,transparent 60%),radial-gradient(ellipse 50% 30% at 50% 100%,rgba(200,168,75,.07) 0%,transparent 60%)}
.p{position:absolute;border-radius:50%;background:rgba(200,168,75,.8);animation:fp linear infinite}
@keyframes fp{0%{transform:translateY(100vh);opacity:0}10%{opacity:1}90%{opacity:.5}100%{transform:translateY(-20px);opacity:0}}
.login-brand{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.brand-logo{width:58px;height:58px;border-radius:16px;background:rgba(200,168,75,.12);border:1px solid rgba(200,168,75,.3);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--gold);letter-spacing:1px;overflow:hidden;cursor:pointer;position:relative;flex-shrink:0}
.brand-logo img{width:100%;height:100%;object-fit:cover;display:none}
.brand-logo input{display:none}
.brand-edit{position:absolute;bottom:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:var(--gold);color:#000;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;pointer-events:none}
.brand-name{font-size:26px;font-weight:800;color:var(--text)}
.brand-sub{font-size:11px;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;margin-top:2px}
.login-card{width:100%;max-width:340px;background:rgba(10,10,10,.9);backdrop-filter:blur(30px);border:1px solid rgba(200,168,75,.18);border-radius:20px;padding:28px 22px;display:flex;flex-direction:column;gap:14px;position:relative;z-index:1}
.login-card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(200,168,75,.5),transparent);border-radius:20px 20px 0 0}
.card-title{font-size:13px;font-weight:700;color:rgba(200,168,75,.9);letter-spacing:1px;text-transform:uppercase}
.inp-wrap{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border:1px solid rgba(200,168,75,.1);border-radius:12px;padding:0 14px;transition:all .2s}
.inp-wrap:focus-within{border-color:rgba(200,168,75,.45);box-shadow:0 0 0 3px rgba(200,168,75,.08)}
.inp{flex:1;padding:13px 0;background:transparent;border:none;color:var(--text);font-size:15px;font-family:inherit;outline:none;-webkit-appearance:none}
.inp::placeholder{color:var(--text3)}
.btn-acc{width:100%;padding:15px;background:linear-gradient(135deg,#D4AA52,#C8A84B,#B8982B);color:#000;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s,transform .15s;margin-top:4px}
.btn-acc:active{opacity:.85;transform:scale(.98)}
.btn-acc:disabled{opacity:.4}
.lerr{font-size:12px;color:var(--red);text-align:center;min-height:16px}
.login-foot{font-size:10px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;position:relative;z-index:1}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;padding-top:calc(10px + var(--st));background:rgba(0,0,0,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);flex-shrink:0;z-index:20}
.tb-l{display:flex;align-items:center;gap:9px;cursor:pointer}
.tb-icon{width:30px;height:30px;border-radius:8px;background:rgba(200,168,75,.1);border:1px solid rgba(200,168,75,.2);display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:var(--gold);letter-spacing:1px;overflow:hidden;flex-shrink:0}
.tb-icon img{width:100%;height:100%;object-fit:cover;display:none}
.tb-name{font-size:16px;font-weight:700;color:var(--gold)}
.tb-r{display:flex;align-items:center;gap:8px}
.tb-dot{width:30px;height:30px;border-radius:50%;background:rgba(200,168,75,.15);border:1px solid rgba(200,168,75,.25);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--gold)}
.btn-out{background:transparent;border:1px solid var(--border2);border-radius:8px;padding:5px 10px;font-size:11px;color:var(--text3);cursor:pointer;font-family:inherit}
.bnav{display:flex;background:rgba(0,0,0,.97);backdrop-filter:blur(20px);border-top:1px solid var(--border);flex-shrink:0;padding-bottom:var(--sb);overflow-x:auto}
.bnav::-webkit-scrollbar{display:none}
.nb{flex:1;min-width:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:7px 4px;background:transparent;border:none;cursor:pointer;font-family:inherit;color:var(--text3);font-size:8.5px;min-height:48px;transition:color .15s;position:relative}
.nb.on{color:var(--gold)}
.nb.on::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:18px;height:2px;border-radius:2px;background:var(--gold)}
.ni{font-size:18px;line-height:1.2}
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.tab{display:none;padding:14px 14px 80px}
.tab.on{display:block;animation:tIn .3s ease}
@keyframes tIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:10px}
.card-body{padding:14px}
.sec{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
.sg4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
@media(max-width:440px){.sg4{grid-template-columns:1fr 1fr}}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:13px;padding:13px}
.stat.g-gold{background:linear-gradient(135deg,rgba(200,168,75,.1),var(--bg2));border-color:rgba(200,168,75,.2)}
.stat.g-green{background:linear-gradient(135deg,rgba(48,209,88,.08),var(--bg2));border-color:rgba(48,209,88,.15)}
.stat.g-red{background:linear-gradient(135deg,rgba(255,69,58,.07),var(--bg2));border-color:rgba(255,69,58,.13)}
.stat.g-blue{background:linear-gradient(135deg,rgba(10,132,255,.08),var(--bg2));border-color:rgba(10,132,255,.15)}
.sl{font-size:10px;color:var(--text3);letter-spacing:.3px;text-transform:uppercase;margin-bottom:6px;font-weight:500}
.sv{font-size:22px;font-weight:700;letter-spacing:-.5px;line-height:1}
.c-gold{color:var(--gold)}.c-green{color:var(--green)}.c-red{color:var(--red)}.c-blue{color:var(--blue)}.c-pur{color:var(--purple)}.c-ora{color:var(--orange)}
.dash-hero{background:linear-gradient(135deg,#141008,#0A0A0A);border:1px solid rgba(200,168,75,.18);border-radius:16px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden}
.dh-lbl{font-size:10px;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;font-weight:600;margin-bottom:4px}
.dh-val{font-size:34px;font-weight:800;letter-spacing:-1.5px;color:var(--gold);line-height:1}
.dh-sub{font-size:11px;color:var(--text3);margin-top:5px}
.dh-badge{display:inline-flex;align-items:center;gap:4px;margin-top:8px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;background:rgba(48,209,88,.1);color:var(--green);border:1px solid rgba(48,209,88,.2)}
.alert-venc{background:rgba(255,69,58,.07);border:1px solid rgba(255,69,58,.2);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.av-n{font-size:13px;font-weight:600}
.av-s{font-size:11px;color:var(--red);margin-top:2px}
.btn-wa{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;background:#25D366;color:#fff;border:none;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;text-decoration:none;flex-shrink:0}
.bar-row{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.bar-lbl{width:82px;font-size:11px;color:var(--text2);flex-shrink:0}
.bar-track{flex:1;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;background:var(--gold)}
.bar-n{width:20px;text-align:right;font-size:11px;color:var(--text2)}
.ri{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.ri:last-child{border-bottom:none;padding-bottom:0}
.ri-av{width:36px;height:36px;border-radius:50%;background:rgba(200,168,75,.1);border:1px solid rgba(200,168,75,.2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--gold);flex-shrink:0}
.ri-i{flex:1;min-width:0}
.ri-n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-s{font-size:11px;color:var(--text3);margin-top:1px}
.ri-m{font-size:14px;font-weight:700;color:var(--green);flex-shrink:0}
.stabs{display:flex;gap:5px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.stabs::-webkit-scrollbar{display:none}
.stab{background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--text3);font-family:inherit;white-space:nowrap;flex-shrink:0}
.stab.on{background:rgba(200,168,75,.12);color:var(--gold);border-color:rgba(200,168,75,.3)}
.toolbar{display:flex;gap:7px;margin-bottom:10px;align-items:center;flex-wrap:wrap}
.srch{flex:1;min-width:110px;height:36px;padding:0 12px;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-size:14px;font-family:inherit;outline:none;-webkit-appearance:none}
.srch:focus{border-color:var(--gold)}
.srch::placeholder{color:var(--text3)}
.ssel{height:36px;padding:0 10px;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-size:12px;font-family:inherit;outline:none;-webkit-appearance:none}
.ssel option{background:var(--bg2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 13px;height:36px;border-radius:10px;font-size:13px;cursor:pointer;font-family:inherit;border:1px solid var(--border2);background:var(--bg2);color:var(--text);white-space:nowrap;flex-shrink:0;text-decoration:none;font-weight:500;transition:opacity .15s,transform .15s}
.btn:active{opacity:.75;transform:scale(.96)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.pri{background:var(--gold);color:#000;border-color:transparent;font-weight:700}
.btn.sec{background:var(--bg3);color:var(--text2)}
.btn.red{background:rgba(255,69,58,.1);color:var(--red);border-color:rgba(255,69,58,.2)}
.btn.grn{background:rgba(48,209,88,.1);color:var(--green);border-color:rgba(48,209,88,.2)}
.btn.pur{background:rgba(191,90,242,.1);color:var(--purple);border-color:rgba(191,90,242,.2)}
.btn.wa2{background:rgba(37,211,102,.1);color:#25D366;border-color:rgba(37,211,102,.25)}
.btn.sm{height:30px;padding:0 11px;font-size:12px;border-radius:8px}
.btn.xs{height:26px;padding:0 9px;font-size:11px;border-radius:7px}
.btn.full{width:100%;justify-content:center;height:44px;font-size:15px;border-radius:12px}
.ac{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:8px}
.ac-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ac-av{width:40px;height:40px;border-radius:50%;background:rgba(200,168,75,.1);border:1px solid rgba(200,168,75,.2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--gold);flex-shrink:0}
.ac-i{flex:1;min-width:0}
.ac-n{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-s{font-size:11px;color:var(--text3);margin-top:2px}
.ac-b{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.ac-a{display:flex;gap:5px;flex-wrap:wrap}
.badge{display:inline-block;padding:3px 8px;border-radius:7px;font-size:11px;font-weight:600}
.b-pre{background:rgba(10,132,255,.1);color:var(--blue);border:1px solid rgba(10,132,255,.18)}
.b-onl{background:rgba(191,90,242,.1);color:var(--purple);border:1px solid rgba(191,90,242,.18)}
.b-per{background:rgba(200,168,75,.1);color:var(--gold);border:1px solid rgba(200,168,75,.18)}
.b-tra{background:rgba(255,159,10,.1);color:var(--orange);border:1px solid rgba(255,159,10,.18)}
.b-act{background:rgba(48,209,88,.1);color:var(--green);border:1px solid rgba(48,209,88,.18)}
.b-ina{background:rgba(255,69,58,.08);color:var(--red);border:1px solid rgba(255,69,58,.15)}
.b-pri{background:var(--bg3);color:var(--text3)}
.b-med{background:rgba(200,168,75,.08);color:var(--gold)}
.b-adv{background:rgba(48,209,88,.08);color:var(--green)}
.b-vr{background:rgba(255,69,58,.1);color:var(--red);border:1px solid rgba(255,69,58,.25)}
.b-ok{background:rgba(48,209,88,.08);color:var(--green);border:1px solid rgba(48,209,88,.18)}
.pgc{background:var(--bg2);border:1px solid var(--border);border-radius:13px;padding:12px 14px;margin-bottom:7px;display:flex;align-items:center;gap:10px}
.pg-av{width:36px;height:36px;border-radius:50%;background:rgba(200,168,75,.1);border:1px solid rgba(200,168,75,.2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--gold);flex-shrink:0}
.pg-i{flex:1;min-width:0}
.pg-n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-s{font-size:11px;color:var(--text3);margin-top:2px}
.pg-r{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.pg-m{font-size:15px;font-weight:700;color:var(--green)}
.prc{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:9px}
.prc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px}
.prc-n{font-size:15px;font-weight:700}
.prc-p{font-size:20px;font-weight:700;color:var(--gold)}
.prc-d{font-size:13px;color:var(--text3);line-height:1.6;margin-bottom:9px}
.prc-s{display:flex;gap:14px;font-size:12px;color:var(--text3);margin-bottom:9px}
.prc-s span{color:var(--text);font-weight:600}
.prc-a{display:flex;gap:6px;padding-top:9px;border-top:1px solid var(--border)}
.fin-tabs{display:flex;gap:3px;margin-bottom:14px;background:var(--bg2);border-radius:11px;padding:3px;border:1px solid var(--border)}
.fin-tab{flex:1;padding:7px 4px;border:none;background:transparent;color:var(--text3);font-size:11px;font-family:inherit;cursor:pointer;border-radius:9px;font-weight:500;text-align:center}
.fin-tab.on{background:var(--bg3);color:var(--text);font-weight:600}
.fin-panel{display:none}
.fin-panel.on{display:block}
.fin-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border)}
.fin-row:last-child{border-bottom:none}
.fin-l{font-size:13px;color:var(--text2)}
.fin-v{font-size:14px;font-weight:700}
.fin-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--bg3);border-radius:10px;margin-bottom:6px}
.fin-item-l{flex:1;min-width:0}
.fin-item-n{font-size:13px;font-weight:500}
.fin-item-s{font-size:11px;color:var(--text3);margin-top:1px}
.fin-item-r{display:flex;align-items:center;gap:7px;flex-shrink:0}
.onl-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:15px;margin-bottom:9px}
.onl-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.onl-av{width:50px;height:50px;border-radius:50%;background:rgba(200,168,75,.1);border:2px solid rgba(200,168,75,.25);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--gold);flex-shrink:0;overflow:hidden;cursor:pointer;position:relative}
.onl-av img{width:100%;height:100%;object-fit:cover}
.onl-av-plus{position:absolute;bottom:-2px;right:-2px;width:18px;height:18px;border-radius:50%;background:var(--gold);color:#000;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center}
.onl-info{flex:1;min-width:0}
.onl-n{font-size:15px;font-weight:700}
.onl-s{font-size:11px;color:var(--text3);margin-top:2px}
.onl-actions{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.prog-sec{border-top:1px solid var(--border);padding-top:10px;margin-top:8px}
.prog-title{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px}
.prog-item{background:var(--bg3);border-radius:9px;padding:10px 12px;margin-bottom:6px}
.prog-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.prog-tipo-lbl{font-size:10px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.3px}
.prog-date{font-size:10px;color:var(--text3)}
.prog-txt{font-size:13px;color:var(--text2);line-height:1.5}
.foto-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.foto-item{aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--bg3);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.foto-item img{width:100%;height:100%;object-fit:cover}
.foto-add{border:2px dashed var(--border2)}
.mkt-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:9px}
.mkt-n{font-size:14px;font-weight:700}
.mkt-s{font-size:11px;color:var(--text3);margin-top:2px}
.mkt-body{font-size:13px;color:var(--text2);line-height:1.6;margin:8px 0}
.mkt-a{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;padding-top:9px;border-top:1px solid var(--border)}
.cfg-s{background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:10px}
.cfg-hdr{padding:11px 15px;border-bottom:1px solid var(--border);font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.5px;text-transform:uppercase}
.cfg-row{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;border-bottom:1px solid var(--border);gap:10px}
.cfg-row:last-child{border-bottom:none}
.cfg-l{font-size:14px;font-weight:500}
.cfg-s2{font-size:11px;color:var(--text3);margin-top:2px}
.color-inp{width:34px;height:34px;border-radius:8px;border:1px solid var(--border2);cursor:pointer;padding:2px;background:transparent}
.user-row{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;border-bottom:1px solid var(--border);gap:10px}

.mb{padding:14px 17px;overflow-y:auto;flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px}

.full{grid-column:1/-1}

.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:rgba(48,209,88,.4);color:var(--green)}
.toast.err{border-color:rgba(255,69,58,.4);color:var(--red)}
.empty{text-align:center;padding:36px 20px;color:var(--text3);font-size:14px}

function verTodoProgreso(aid){const a=alumnos.find(function(x){return x.id===aid;});const progs=(progresos[aid]||[]).slice().reverse();const ov=document.createElement('div');ov.className='overlay on';var ph='';progs.forEach(function(p){ph+='<div class="prog-item" style="margin-bottom:8px"><div class="prog-hdr"><span class="prog-tipo-lbl">'+p.tipo+'</span><span class="prog-date">'+fd(p.fecha)+(p.peso?' - '+p.peso+'kg':'')+'</span></div><div class="prog-txt">'+p.txt+'</div></div>';});ov.innerHTML='<div class="modal" style="max-height:85dvh"><div class="mh"><h2>Historial - '+(a?a.nombre:'')+'</h2><button class="btn sm sec" onclick="this.closest(\'.overlay\').remove()">x</button></div><div style="overflow-y:auto;flex:1;padding:14px 17px">'+ph+'</div></div>';ov.onclick=function(e){if(e.target===ov)ov.remove();};document.body.appendChild(ov);}
function renderOnline(){
  const onl=alumnos.filter(function(a){return a.modal==='online';});
  if(!onl.length){$('tab-o').innerHTML='<div class="empty">No hay alumnos online.<br><br><button class="btn pri" onclick="openAlumnoOnline()">+ Agregar online</button></div>';return;}
  var cards='';
  onl.forEach(function(a){
    const progs=(progresos[a.id]||[]).slice().reverse();
    const fts=fotos[a.id]||[];
    const lk=waLink(a.tel,waMsg(a));
    var fotosHtml='';fts.slice(0,6).forEach(function(f,i){fotosHtml+='<div class="foto-item" onclick="verFoto('+a.id+','+i+')"><img src="'+f+'" alt="foto" loading="lazy"></div>';});
    var progHtml='';progs.slice(0,3).forEach(function(p){progHtml+='<div class="prog-item"><div class="prog-hdr"><span class="prog-tipo-lbl">'+p.tipo+'</span><span class="prog-date">'+fd(p.fecha)+(p.peso?' - '+p.peso+'kg':'')+'</span></div><div class="prog-txt">'+p.txt+'</div></div>';});
    const repMsg='Reporte ProClub - '+a.nombre+'\n\nFecha: '+fd(new Date().toISOString().split('T')[0])+'\nPlan: '+a.plan+(a.peso?'\nPeso: '+a.peso+'kg':'')+(progs[0]?'\n\nUltimo registro:\n'+progs[0].txt:'')+'\n\nSeguimos! - ProClub';
    const repLk=waLink(a.tel,repMsg);
    cards+='<div class="onl-card">'
      +'<div class="onl-top"><div class="onl-av" onclick="addFoto('+a.id+')">'+(fts.length?'<img src="'+fts[fts.length-1]+'" alt="">':'<span>'+ini(a.nombre)+'</span>')+'<div class="onl-av-plus">+</div><input type="file" id="foto-file-'+a.id+'" accept="image/*" multiple onchange="processFoto(event,'+a.id+')" style="display:none"></div>'
      +'<div class="onl-info"><div class="onl-n">'+a.nombre+'</div><div class="onl-s">'+a.plan+'</div>'+vBadge(a)+'</div></div>'
      +'<div class="onl-actions">'+(lk?'<a href="'+lk+'" target="_blank" class="btn xs wa2">Chat directo</a>':'')+(repLk?'<a href="'+repLk+'" target="_blank" class="btn xs grn">Reporte WA</a>':'')+'<button class="btn xs pur" onclick="generarPDF('+a.id+')">Ver PDF</button><button class="btn xs" onclick="openProgreso('+a.id+')">+ Progreso</button><button class="btn xs" onclick="editAlumno('+a.id+')">Editar</button></div>'
      +'<div class="prog-sec"><div class="prog-title">Fotos ('+fts.length+')</div><div class="foto-grid">'+fotosHtml+'<div class="foto-item foto-add" onclick="addFoto('+a.id+')" style="gap:4px"><span style="font-size:18px">+</span><span style="font-size:10px;color:var(--text3)">Foto</span></div></div></div>'
      +(progs.length?'<div class="prog-sec"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div class="prog-title" style="margin:0">Historial ('+progs.length+')</div>'+(progs.length>3?'<button class="btn xs sec" onclick="verTodoProgreso('+a.id+')">Ver todo</button>':'')+'</div>'+progHtml+'</div>':'')
      +'</div>';
  });
  $('tab-o').innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div class="sec" style="margin:0">Online - '+onl.length+'</div><button class="btn xs pri" onclick="openAlumnoOnline()">+ Online</button></div>'+cards;
}
function openAlumnoOnline(){openAlumno();setTimeout(function(){$('a-modal').value='online';updatePlanes();},50);}
function generarPDF(aid){
  const a=alumnos.find(function(x){return x.id===aid;});if(!a){toast('Alumno no encontrado','err');return;}
  const progs=(progresos[aid]||[]).slice().reverse();
  const fts=fotos[aid]||[];
  const edad=a.nac?(new Date().getFullYear()-parseInt(a.nac.slice(0,4))):null;
  const win=window.open('','_blank');
  if(!win){toast('Popup bloqueado. Permitilo en el navegador.','err');return;}
  var fi='';fts.slice(0,6).forEach(function(f){fi+='<img class="fimg" src="'+f+'">';});
  var ph='';progs.slice(0,8).forEach(function(p){ph+='<div class="pc2"><div class="ph2"><span class="pt2">'+p.tipo+'</span><span class="pd2">'+fd(p.fecha)+(p.peso?' - '+p.peso+'kg':'')+'</span></div><div class="ptxt2">'+p.txt+'</div></div>';});
  win.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Reporte ProClub - '+a.nombre+'</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,sans-serif;color:#1a1a1a;padding:40px}.hdr{display:flex;justify-content:space-between;margin-bottom:28px;padding-bottom:20px;border-bottom:3px solid #C8A84B}.brand{font-size:26px;font-weight:800;color:#C8A84B}.box{background:#f9f7f2;border-radius:10px;padding:20px;margin-bottom:20px;border-left:4px solid #C8A84B}.nom{font-size:20px;font-weight:700;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lbl{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:.5px}.val{font-size:13px;font-weight:500}.stitle{font-size:12px;font-weight:700;color:#C8A84B;text-transform:uppercase;letter-spacing:1px;margin:20px 0 10px}.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}.fimg{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px}.pc2{border:1px solid #e8e0d0;border-radius:8px;padding:12px;margin-bottom:8px}.ph2{display:flex;justify-content:space-between;margin-bottom:6px}.pt2{font-size:11px;font-weight:700;color:#C8A84B;text-transform:uppercase}.pd2{font-size:11px;color:#888}.ptxt2{font-size:13px;color:#444;line-height:1.6}.foot{margin-top:30px;padding-top:14px;border-top:1px solid #e8e0d0;display:flex;justify-content:space-between;font-size:11px;color:#aaa}.footb{font-weight:700;color:#C8A84B}@media print{body{print-color-adjust:exact;-webkit-print-color-adjust:exact}}</style></head><body><div class="hdr"><div><div class="brand">ProClub</div><div style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:1px">Sistema de gestion</div></div><div style="font-size:12px;color:#888;text-align:right">Generado el<br>'+new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'long',year:'numeric'})+'</div></div><div class="box"><div class="nom">'+a.nombre+'</div><div class="grid"><div><div class="lbl">Plan</div><div class="val">'+a.plan+'</div></div><div><div class="lbl">Estado</div><div class="val">'+(a.estado==='activo'?'Activo':'Inactivo')+'</div></div><div><div class="lbl">Nivel</div><div class="val">'+a.nivel+'</div></div>'+(edad?'<div><div class="lbl">Edad</div><div class="val">'+edad+' anios</div></div>':'')+(a.peso?'<div><div class="lbl">Peso</div><div class="val">'+a.peso+' kg</div></div>':'')+(a.altura?'<div><div class="lbl">Altura</div><div class="val">'+a.altura+' cm</div></div>':'')+(a.inicio?'<div><div class="lbl">Inicio</div><div class="val">'+fd(a.inicio)+'</div></div>':'')+(a.venc?'<div><div class="lbl">Vencimiento</div><div class="val">'+fd(a.venc)+'</div></div>':'')+'</div>'+(a.notas?'<p style="margin-top:12px;font-size:13px;color:#555;line-height:1.5"><b>Obs:</b> '+a.notas+'</p>':'')+'</div>'+(fi?'<div class="stitle">Fotos de progreso</div><div class="fgrid">'+fi+'</div>':'')+(ph?'<div class="stitle">Historial</div>'+ph:'')+'<div class="foot"><div class="footb">ProClub - San Luis, Argentina</div><div>Generado por ProClub AI</div></div>');
  win.document.write('<scr'+'ipt>window.onload=function(){setTimeout(function(){window.print();},400);}<'+'/scr'+'ipt></body></html>');
  win.document.close();toast('PDF listo');
}
function renderConfig(){
  var usersH='';usuarios.forEach(function(u){usersH+='<div class="user-row"><div><div class="u-name">'+u.nombre+'</div><div class="u-sub">@'+u.username+(u.id===CU.id?' - (vos)':'')+'</div></div><div style="display:flex;align-items:center;gap:8px"><span class="role-tag '+(u.rol==='admin'?'rt-admin':'rt-coach')+'">'+(u.rol==='admin'?'Admin':'Coach')+'</span><button class="btn xs sec" onclick="editUsuario('+u.id+')">Editar</button></div></div>';});
  $('tab-c').innerHTML='<div class="cfg-s"><div class="cfg-hdr">Logo del negocio</div><div class="logo-area"><div class="logo-pick" onclick="document.getElementById(\'cfg-logo-file\').click()">'+(CFG.logoB64?'<img src="'+CFG.logoB64+'" style="display:block">':'<div style="font-size:22px">🏋️</div><div style="font-size:11px;color:var(--text3)">Tocar para subir</div>')+'<input type="file" id="cfg-logo-file" accept="image/*" onchange="cfgLogo(event)"></div>'+(CFG.logoB64?'<button class="btn xs red" onclick="quitarLogo()">Quitar logo</button>':'')+'</div></div>'
    +'<div class="cfg-s"><div class="cfg-hdr">Nombre del negocio</div><div class="cfg-row"><input class="srch" id="cfg-nombre" type="text" value="'+CFG.nombre+'" placeholder="ProClub" style="height:36px;flex:1"><button class="btn sm pri" onclick="guardarNombre()">Guardar</button></div></div>'
    +'<div class="cfg-s"><div class="cfg-hdr">Color de acento</div><div class="cfg-row"><div><div class="cfg-l">Color principal</div><div class="cfg-s2">Botones y elementos destacados</div></div><input type="color" class="color-inp" value="'+(CFG.colorAccent||'#C8A84B')+'" onchange="cambiarColor(this.value)"></div><div class="cfg-row" style="border:none;padding-top:6px"><button class="btn sm sec" onclick="resetColor()">Restaurar dorado</button></div></div>'
    +'<div class="cfg-s"><div class="cfg-hdr">Usuarios del sistema</div>'+usersH+'<div style="padding:12px 15px;border-top:1px solid var(--border)"><button class="btn pri full" onclick="openUsuario()">+ Nuevo usuario</button></div></div>'
    +'<div class="cfg-s"><div class="cfg-hdr">Asistente IA</div><div class="cfg-row"><div><div class="cfg-l">Contador - Estratega - Coach</div><div class="cfg-s2">Reportes y estrategia de crecimiento</div></div><button class="btn sm pur" onclick="openIA()">Abrir</button></div></div>';
}
function cfgLogo(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=function(ev){CFG.logoB64=ev.target.result;saveCFG();applyTheme();renderConfig();toast('Logo actualizado');};r.readAsDataURL(f);}
function quitarLogo(){CFG.logoB64='';saveCFG();applyTheme();renderConfig();toast('Logo quitado');}
function guardarNombre(){const n=($('cfg-nombre')||{value:''}).value.trim();if(!n){toast('Ingresa un nombre','err');return;}CFG.nombre=n;saveCFG();applyTheme();toast('Nombre actualizado');}
function cambiarColor(v){CFG.colorAccent=v;saveCFG();applyTheme();}
function resetColor(){CFG.colorAccent='#C8A84B';saveCFG();applyTheme();renderConfig();toast('Color restaurado');}
function openUsuario(){editUid=null;$('mu-t').textContent='Nuevo usuario';$('btn-du').style.display='none';['u-nombre','u-user','u-pass'].forEach(function(id){const e=$(id);if(e)e.value='';});$('u-rol').value='coach';openM('m-u');}
function editUsuario(id){editUid=id;const u=usuarios.find(function(x){return x.id===id;});if(!u)return;$('mu-t').textContent='Editar usuario';$('btn-du').style.display=u.id===CU.id?'none':'flex';$('u-nombre').value=u.nombre||'';$('u-user').value=u.username||'';$('u-pass').value=u.password||'';$('u-rol').value=u.rol||'coach';openM('m-u');}
async function guardarUsuario(){
  const nombre=($('u-nombre').value||'').trim(),username=($('u-user').value||'').trim().toLowerCase(),password=($('u-pass').value||'').trim(),rol=$('u-rol').value;
  if(!nombre||!username||!password){toast('Todos los campos son obligatorios','err');return;}
  if(password.length<4){toast('Contrasena minimo 4 caracteres','err');return;}
  try{if(editUid){const res=await sbU('app_usuarios',editUid,{nombre:nombre,username:username,password:password,rol:rol});const i=usuarios.findIndex(function(x){return x.id===editUid;});if(i>-1)usuarios[i]=Object.assign({},usuarios[i],res[0]||{nombre:nombre,username:username,password:password,rol:rol});if(CU&&editUid===CU.id){CU.nombre=nombre;$('tb-dot').textContent=ini(nombre);}toast('Usuario actualizado');}else{const res=await sbP('app_usuarios',{nombre:nombre,username:username,password:password,rol:rol});usuarios.push(res[0]);toast('Usuario creado');}closeM('m-u');renderConfig();}catch(e){toast('Error - ese usuario ya puede existir','err');}
}
async function elimUsuario(){if(!confirm('Eliminar usuario?'))return;try{await sbD('app_usuarios',editUid);usuarios=usuarios.filter(function(x){return x.id!==editUid;});closeM('m-u');renderConfig();toast('Eliminado');}catch(e){toast('Error','err');}}
function openIA(){iaHistory=[];$('ia-msgs').innerHTML='<div class="msg ai">Hola '+(CU?CU.nombre.split(' ')[0]:'')+'. Soy tu asesor de ProClub. Actuo como contador, estratega y coach. Tengo acceso a los datos reales del negocio. En que te ayudo?</div>';showS('s-ia');}
function closeIA(){showS('s-app');}
function qm(msg){const inp=$('ia-inp');if(inp)inp.value=msg;sendIA();}
async function sendIA(){
  const inp=$('ia-inp'),msg=(inp.value||'').trim();if(!msg)return;
  const send=$('ia-send');
  const msgsEl=$('ia-msgs');
  msgsEl.innerHTML+='<div class="msg usr">'+msg+'</div>';
  iaHistory.push({role:'user',content:msg});
  inp.value='';inp.style.height='auto';send.disabled=true;
  const lid='il'+Date.now();
  msgsEl.innerHTML+='<div class="msg ai load" id="'+lid+'">Analizando...</div>';
  msgsEl.scrollTop=msgsEl.scrollHeight;
  const ing=pagos.reduce(function(s,p){return s+Number(p.monto);},0);
  const act=alumnos.filter(function(a){return a.estado==='activo';}).length;
  const cf=costos.filter(function(c){return c.tipo==='fijo';}).reduce(function(s,c){return s+Number(c.valor);},0);
  const cv=costos.filter(function(c){return c.tipo==='variable';}).reduce(function(s,c){return s+Number(c.valor);},0);
  const tc=cf+cv,res=ing-tc,mar=ing>0?Math.round(res/ing*100):0;
  const ti=inversiones.reduce(function(s,i){return s+Number(i.valor);},0);
  var mStr='';const meses={};pagos.forEach(function(p){if(!p.fecha)return;const m=p.fecha.slice(0,7);meses[m]=(meses[m]||0)+Number(p.monto);});Object.entries(meses).sort(function(a,b){return b[0].localeCompare(a[0]);}).slice(0,3).forEach(function(e){mStr+=e[0]+': $'+Number(e[1]).toLocaleString('es-AR')+', ';});
  try{
    const r=await fetch('https://proclub-ia.francomeloni04.workers.dev',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1200,system:'Sos el asesor de '+(CFG.nombre||'ProClub')+', gimnasio boutique en San Luis, Argentina. Franco y Anyelen son los duenos.\nDATOS REALES:\nIngresos: $'+ing.toLocaleString('es-AR')+'\nCostos fijos: $'+cf.toLocaleString('es-AR')+'\nVariables: $'+cv.toLocaleString('es-AR')+'\nResultado: $'+res.toLocaleString('es-AR')+'\nMargen: '+mar+'%\nInversiones: $'+ti.toLocaleString('es-AR')+'\nMeses: '+mStr+'\nAlumnos: '+alumnos.length+' ('+act+' activos)\nInstrucciones: Espanol argentino, directo. Max 400 palabras. Termina con UNA accion para HOY.',messages:iaHistory})});
    const d=await r.json();
    const txt=d.content&&d.content[0]?d.content[0].text:'Sin respuesta';
    iaHistory.push({role:'assistant',content:txt});
    const el=document.getElementById(lid);
    if(el)el.outerHTML='<div class="msg ai">'+txt.replace(/\n/g,'<br>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')+'</div>';
  }catch(e){const el=document.getElementById(lid);if(el)el.outerHTML='<div class="msg ai" style="color:var(--red)">Error de conexion. Intentalo de nuevo.</div>';}
  finally{send.disabled=false;msgsEl.scrollTop=msgsEl.scrollHeight;}
}
$('ia-inp').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendIA();}});
$('ia-inp').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,80)+'px';});
init();
</script>
