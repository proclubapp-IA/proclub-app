<script>

const PLANES={
  presencial:['Plan Start','Plan Plus','Plan Prime','Plan Elite'],
  online:['Plan Start Online','Plan Plus Online','Plan Prime Online','Plan Elite Online'],
  personal:['Plan Black 2x/semana','Plan Black 3x/semana','Plan Black 4x/semana'],
  transformacion:['Transformacion GAP 3 meses','Transformacion Masa Muscular 3 meses','Transformacion Descenso de Peso 3 meses']
};

let CU=null,alumnos=[],pagos=[],promos=[],usuarios=[],costos=[],inversiones=[],campanas={};
let progresos={},fotos={};
let curTab='d',curSub='todos',editId=null,editUid=null,editCid=null,editIid=null,editMid=null,progAid=null;
let iaHistory=[];
let CFG={nombre:'ProClub',logoB64:'',colorAccent:'#C8A84B'};

const $=id=>document.getElementById(id);
const fd=d=>d?d.split('-').reverse().join('/'):'--';
const ini=n=>(n||'?').split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
const fmtM=n=>'$'+Number(n||0).toLocaleString('es-AR');
function dias(v){if(!v)return null;const h=new Date();h.setHours(0,0,0,0);const d=new Date(v);d.setHours(0,0,0,0);return Math.round((d-h)/864e5);}
function waLink(tel,msg){const n=(tel||'').replace(/\D/g,'');if(!n||n.length<8)return null;return'https://wa.me/'+n+'?text='+encodeURIComponent(msg);}
function waMsg(a){
  const d=dias(a.venc),nom=a.nombre.split(' ')[0];
  const datos='\n\n\uD83D\uDCB3 proclubarg\n\uD83D\uDC64 Franco Nicol\u00e1s Meloni\n\uD83C\uDFE6 Brubank\n\nEnvi\u00e1nos el comprobante y tu plan ser\u00e1 habilitado autom\u00e1ticamente. Gracias por ser parte de ProClub \uD83D\uDC9B';
  if(d===null)return 'Hola '+nom+'! Te escribimos desde ProClub. Renovamos tu plan?';
  if(d<=0)return 'PRO AI \u2022 ProClub\nHola '+nom+'! Tu membres\u00eda venci\u00f3 el '+fd(a.venc)+'. Para reactivar:'+datos;
  return 'PRO AI \u2022 ProClub\nHola '+nom+'! Tu membres\u00eda vence en '+d+' d\u00eda'+(d!==1?'s':'')+'. Para renovar:'+datos;
}
function toast(msg,t){const el=$('toast');el.textContent=msg;el.className='toast '+(t||'ok')+' show';clearTimeout(el._t);el._t=setTimeout(()=>el.className='toast',2400);}
function setBtn(b,on){if(!b)return;b.disabled=on;if(on){b._t=b.textContent;b.textContent='...';}else b.textContent=b._t||b.textContent;}
function mBadge(m){const mp={presencial:['b-pre','Presencial'],online:['b-onl','Online'],personal:['b-per','Plan Black'],transformacion:['b-tra','Transform.']};const r=mp[m]||['b-pri',m];return '<span class="badge '+r[0]+'">'+r[1]+'</span>';}
function eBadge(e){return '<span class="badge '+(e==='activo'?'b-act':'b-ina')+'">'+(e==='activo'?'Activo':'Inactivo')+'</span>';}
function nBadge(n){const c=n==='principiante'?'b-pri':n==='intermedio'?'b-med':'b-adv';return '<span class="badge '+c+'">'+n.charAt(0).toUpperCase()+n.slice(1)+'</span>';}
function vBadge(a){if(!a.venc||a.estado==='inactivo')return'';const d=dias(a.venc);if(d===null)return'';if(d<=0)return'<span class="badge b-vr">Vencido</span>';if(d<=3)return'<span class="badge b-vr">Vence '+d+'d</span>';if(d<=7)return'<span class="badge b-vr">'+d+'d</span>';if(d<=15)return'<span class="badge" style="background:rgba(255,159,10,.1);color:var(--orange);border:1px solid rgba(255,159,10,.2)">'+fd(a.venc)+'</span>';return'<span class="badge b-ok">'+fd(a.venc)+'</span>';}

function saveCFG(){try{localStorage.setItem('pc_cfg7',JSON.stringify(CFG));}catch(e){}}
function loadCFG(){try{const c=localStorage.getItem('pc_cfg7');if(c)CFG={...CFG,...JSON.parse(c)};}catch(e){}}
function hexA(hex,a){try{const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return'rgba('+r+','+g+','+b+','+a+')';}catch(e){return'rgba(200,168,75,'+a+')';}}
function applyTheme(){
  const ac=CFG.colorAccent||'#C8A84B';
  document.documentElement.style.setProperty('--gold',ac);
  document.documentElement.style.setProperty('--gold2',hexA(ac,.15));
  document.documentElement.style.setProperty('--gold3',hexA(ac,.08));
  const logo=CFG.logoB64;
  ['tb-logo-img','ll-img','load-logo-img'].forEach(id=>{const e=$(id);if(e){e.src=logo||'';e.style.display=logo?'block':'none';}});
  const lltxt=$('ll-txt');if(lltxt)lltxt.style.display=logo?'none':'';
  const tbi=$('tb-icon');if(tbi)tbi.childNodes[0].textContent=logo?'':'PC';
  [$('tb-name'),$('login-title')].forEach(e=>{if(e)e.textContent=CFG.nombre||'ProClub';});
}
function loginUploadLogo(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{CFG.logoB64=ev.target.result;saveCFG();applyTheme();toast('Logo actualizado');};r.readAsDataURL(f);}
function makeParticles(){const c=$('particles');if(!c)return;c.innerHTML='';for(let i=0;i<14;i++){const p=document.createElement('div');p.className='p';const sz=Math.random()*4+1.5;p.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+Math.random()*100+'%;bottom:-10px;animation-duration:'+(8+Math.random()*10)+'s;animation-delay:'+(-Math.random()*12)+'s';c.appendChild(p);}}

async function init(){
  showS('s-load');loadCFG();applyTheme();makeParticles();
  try{
    const[a,p,pr,u]=await Promise.all([sbG('alumnos','order=nombre.asc'),sbG('pagos','order=fecha.desc'),sbG('promos','order=created_at.desc'),sbG('app_usuarios','order=nombre.asc')]);
    alumnos=a||[];pagos=p||[];promos=pr||[];usuarios=u||[];
    try{const x=localStorage.getItem('pc_costos');if(x)costos=JSON.parse(x);}catch(e){}
    try{const x=localStorage.getItem('pc_inv');if(x)inversiones=JSON.parse(x);}catch(e){}
    try{const x=localStorage.getItem('pc_mkt');if(x)campanas=JSON.parse(x);}catch(e){}
    try{const x=localStorage.getItem('pc_prog');if(x)progresos=JSON.parse(x);}catch(e){}
    try{const x=localStorage.getItem('pc_fotos');if(x)fotos=JSON.parse(x);}catch(e){}
  }catch(e){console.warn('Init:',e);}
  showS('s-login');
}
function showS(id){['s-load','s-login','s-app','s-ia'].forEach(s=>{const el=$(s);if(el)el.classList.toggle('on',el.id===id);});}

async function doLogin(){
  const u=($('lu').value||'').trim().toLowerCase(),p=$('lp').value||'';
  $('lerr').textContent='';
  if(!u||!p){$('lerr').textContent='Ingresa usuario y contrasena';return;}
  const b=$('lbtn');setBtn(b,true);
  try{
    const res=await sbG('app_usuarios','username=eq.'+u+'&password=eq.'+p+'&select=*');
    if(!res||!res.length){$('lerr').textContent='Usuario o contrasena incorrectos';return;}
    CU={...res[0]};$('tb-dot').textContent=ini(CU.nombre);
    buildNav();showS('s-app');showTab('d');
  }catch(e){$('lerr').textContent='Error de conexion. Verifica internet.';}
  finally{setBtn(b,false);}
}
$('lp').onkeydown=e=>{if(e.key==='Enter')doLogin();};
$('lu').onkeydown=e=>{if(e.key==='Enter')$('lp').focus();};
function doLogout(){CU=null;showS('s-login');$('lu').value='';$('lp').value='';}
function goHome(){if(CU)showTab('d');else showS('s-login');}
function openM(id){const el=$(id);if(el)el.classList.add('on');}
function closeM(id){const el=$(id);if(el)el.classList.remove('on');}
document.querySelectorAll('.overlay').forEach(ov=>ov.addEventListener('click',e=>{if(e.target===ov)ov.classList.remove('on');}));

const NAVS=[{id:'d',icon:'&#9632;',label:'Inicio',roles:['admin','coach']},{id:'a',icon:'&#128101;',label:'Alumnos',roles:['admin','coach']},{id:'p',icon:'&#128179;',label:'Pagos',roles:['admin','coach']},{id:'f',icon:'&#128200;',label:'Finanzas',roles:['admin']},{id:'v',icon:'&#127991;',label:'Ventas',roles:['admin','coach']},{id:'m',icon:'&#128226;',label:'Mkt',roles:['admin']},{id:'o',icon:'&#127760;',label:'Online',roles:['admin','coach']},{id:'c',icon:'&#9881;',label:'Config',roles:['admin']}];
const NAV_LABELS={d:'Inicio',a:'Alumnos',p:'Pagos',f:'Finanzas',v:'Ventas',m:'Marketing',o:'Online',c:'Configuracion'};
function buildNav(){
  const nb=$('bnav');nb.innerHTML='';
  NAVS.filter(t=>t.roles.includes(CU.rol)).forEach(t=>{
    const b=document.createElement('button');b.className='nb';b.dataset.id=t.id;
    b.innerHTML='<span class="ni">'+t.icon+'</span><span>'+t.label+'</span>';
    b.onclick=()=>showTab(t.id);
    nb.appendChild(b);
  });
}
function showTab(id){
  curTab=id;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  const tab=$('tab-'+id);if(tab)tab.classList.add('on');
  $('content').scrollTop=0;
  ({d:renderDash,a:renderAlumnos,p:renderPagos,f:renderFinanzas,v:renderPromos,m:renderMkt,o:renderOnline,c:renderConfig}[id]||function(){})();
}

function renderDash(){
  const act=alumnos.filter(a=>a.estado==='activo');
  const ing=pagos.reduce((s,p)=>s+Number(p.monto),0);
  const costoT=costos.reduce((s,c)=>s+Number(c.valor),0);
  const res=ing-costoT,mar=ing>0?Math.round(res/ing*100):0;
  const tot=alumnos.length||1;
  const xv=act.filter(a=>{const d=dias(a.venc);return d!==null&&d<=5;}).sort((a,b)=>dias(a.venc)-dias(b.venc));
  let alerts='';
  if(xv.length){alerts='<div style="margin-bottom:14px"><div class="sec" style="color:var(--red);margin-top:0">Vencimientos proximos ('+xv.length+')</div>'+xv.map(a=>{const d=dias(a.venc);const txt=d<=0?'Vencio hace '+Math.abs(d)+'d':'Vence en '+d+'d';const lk=waLink(a.tel,waMsg(a));return'<div class="alert-venc"><div><div class="av-n">'+a.nombre+'</div><div class="av-s">'+txt+' - '+a.plan+'</div></div><div style="display:flex;gap:6px">'+(lk?'<a href="'+lk+'" target="_blank" class="btn-wa">Avisar</a>':'')+'<button class="btn xs" onclick="editAlumno('+a.id+');showTab(\'a\')">Ver</button></div></div>';}).join('')+'</div>';}
  const modMap={presencial:'Presencial',online:'Online',personal:'Plan Black',transformacion:'Transform.'};
  const modC={presencial:'var(--blue)',online:'var(--purple)',personal:'var(--gold)',transformacion:'var(--orange)'};
  const modH=Object.entries(modMap).map(([k,l])=>{const c=alumnos.filter(a=>a.modal===k).length;const p=Math.round(c/tot*100);return'<div class="bar-row"><div class="bar-lbl">'+l+'</div><div class="bar-track"><div class="bar-fill" style="width:'+p+'%;background:'+modC[k]+'"></div></div><div class="bar-n">'+c+'</div></div>';}).join('');
  const nivH=['principiante','intermedio','avanzado'].map(k=>{const c=alumnos.filter(a=>a.nivel===k).length;const p=Math.round(c/tot*100);const col=k==='principiante'?'var(--text3)':k==='intermedio'?'var(--orange)':'var(--green)';return'<div class="bar-row"><div class="bar-lbl" style="text-transform:capitalize">'+k+'</div><div class="bar-track"><div class="bar-fill" style="width:'+p+'%;background:'+col+'"></div></div><div class="bar-n">'+c+'</div></div>';}).join('');
  const recH=pagos.slice(0,5).map(pg=>{const a=alumnos.find(x=>x.id===pg.aid);return'<div class="ri"><div class="ri-av">'+(a?ini(a.nombre):'?')+'</div><div class="ri-i"><div class="ri-n">'+(a?a.nombre:'--')+'</div><div class="ri-s">'+fd(pg.fecha)+' - '+(pg.concepto||'Pago')+'</div></div><div class="ri-m">'+fmtM(pg.monto)+'</div></div>';}).join('');
  $('tab-d').innerHTML=alerts+'<div class="dash-hero"><div class="dh-lbl">Resultado del periodo</div><div class="dh-val">'+fmtM(res)+'</div><div class="dh-sub">Ingresos '+fmtM(ing)+' &middot; Costos '+fmtM(costoT)+'</div><div class="dh-badge">Margen '+mar+'%</div></div><div class="sg4"><div class="stat g-blue"><div class="sl">Total</div><div class="sv c-blue">'+alumnos.length+'</div></div><div class="stat g-green"><div class="sl">Activos</div><div class="sv c-green">'+act.length+'</div></div><div class="stat g-gold"><div class="sl">Ingresos</div><div class="sv c-gold" style="font-size:16px">'+fmtM(ing)+'</div></div><div class="stat '+(res>=0?'g-green':'g-red')+'"><div class="sl">Neto</div><div class="sv '+(res>=0?'c-green':'c-red')+'" style="font-size:16px">'+fmtM(res)+'</div></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px"><div class="card"><div class="card-body"><div class="sec" style="margin:0 0 10px">Modalidad</div>'+modH+'</div></div><div class="card"><div class="card-body"><div class="sec" style="margin:0 0 10px">Nivel</div>'+nivH+'</div></div></div><div class="sec">Ultimos pagos</div><div class="card"><div class="card-body">'+(recH||'<div class="empty" style="padding:14px">Sin pagos</div>')+'</div></div>';
}

function updatePlanes(){const m=($('a-modal')||{value:'presencial'}).value;const sel=$('a-plan');if(!sel)return;const cur=sel.value;sel.innerHTML=(PLANES[m]||PLANES.presencial).map(p=>'<option value="'+p+'"'+(cur===p?' selected':'')+'>'+p+'</option>').join('');}

function renderAlumnos(){
  const q=($('srch-a')||{value:''}).value.toLowerCase();
  const fe=($('f-est')||{value:''}).value;
  const fs=($('f-sort')||{value:'nombre'}).value;
  const fn=($('f-niv')||{value:''}).value;
  const fx=($('f-sex')||{value:''}).value;
  let list=alumnos.filter(a=>{
    if(curSub==='vence_pronto'){const d=dias(a.venc);if(a.estado!=='activo'||d===null||d>7)return false;}
    else if(curSub==='vigente'){const d=dias(a.venc);if(a.estado!=='activo'||d===null||d<=7)return false;}
    else if(['principiante','intermedio','avanzado'].includes(curSub)){if(a.nivel!==curSub)return false;}
    else if(curSub!=='todos'&&a.modal!==curSub)return false;
    if(fe&&a.estado!==fe)return false;
    if(fn&&a.nivel!==fn)return false;
    if(fx&&a.sexo!==fx)return false;
    if(q&&!a.nombre.toLowerCase().includes(q))return false;
    return true;
  });
  list=[...list].sort((a,b)=>{
    if(fs==='apellido'){const pa=(a.nombre||'').trim().split(' ').pop()||'';const pb=(b.nombre||'').trim().split(' ').pop()||'';return pa.localeCompare(pb,'es');}
    if(fs==='nombre')return(a.nombre||'').localeCompare(b.nombre||'','es');
    if(fs==='inicio_asc')return(a.inicio||'').localeCompare(b.inicio||'');
    if(fs==='inicio_desc')return(b.inicio||'').localeCompare(a.inicio||'');
    if(fs==='venc')return(a.venc||'9999').localeCompare(b.venc||'9999');
    if(fs==='edad'){const ya=a.nac?new Date().getFullYear()-parseInt(a.nac.slice(0,4)):999;const yb=b.nac?new Date().getFullYear()-parseInt(b.nac.slice(0,4)):999;return ya-yb;}
    if(fs==='peso')return(Number(b.peso)||0)-(Number(a.peso)||0);
    if(fs==='altura')return(Number(b.altura)||0)-(Number(a.altura)||0);
    return 0;
  });
  const subs=[{k:'todos',l:'Todos'},{k:'presencial',l:'Presencial'},{k:'online',l:'Online'},{k:'personal',l:'Plan Black'},{k:'transformacion',l:'Transform.'},{k:'principiante',l:'Principiante'},{k:'intermedio',l:'Intermedio'},{k:'avanzado',l:'Avanzado'},{k:'vence_pronto',l:'Vence pronto'},{k:'vigente',l:'Vigentes'}];
  const subH=subs.map(({k,l})=>'<button class="stab'+(curSub===k?' on':'')+'" onclick="setSub(\''+k+'\')">'+l+'</button>').join('');
  const listH=list.length?list.map(a=>{
    const lk=waLink(a.tel,waMsg(a));
    const edad=a.nac?(new Date().getFullYear()-parseInt(a.nac.slice(0,4))):null;
    const extra=[edad?edad+'a':null,a.peso?a.peso+'kg':null,a.altura?a.altura+'cm':null,a.sexo].filter(Boolean).join(' - ');
    return'<div class="ac"><div class="ac-top"><div class="ac-av">'+ini(a.nombre)+'</div><div class="ac-i"><div class="ac-n">'+a.nombre+'</div><div class="ac-s">'+a.plan+(extra?' - '+extra:'')+'</div><div class="ac-s">Ingreso: '+fd(a.inicio)+'</div></div></div><div class="ac-b">'+mBadge(a.modal)+' '+eBadge(a.estado)+' '+nBadge(a.nivel)+' '+vBadge(a)+'</div><div class="ac-a"><button class="btn xs" onclick="editAlumno('+a.id+')">Editar</button><button class="btn xs '+(a.estado==='activo'?'red':'grn')+'" onclick="toggleEs('+a.id+')">'+(a.estado==='activo'?'Inactivar':'Activar')+'</button>'+(lk?'<a href="'+lk+'" target="_blank" class="btn xs wa2">WA</a>':'')+'</div></div>';
  }).join(''):'<div class="empty">Sin alumnos</div>';
  $('tab-a').innerHTML='<div class="stabs">'+subH+'</div>'
    +'<div class="toolbar"><input class="srch" id="srch-a" type="text" placeholder="Buscar..." oninput="renderAlumnos()" value="'+q+'" style="flex:1"><button class="btn sm pri" onclick="openAlumno()">+ Nuevo</button></div>'
    +'<div class="toolbar" style="gap:5px;margin-bottom:8px">'
    +'<select class="ssel" id="f-sort" onchange="renderAlumnos()" style="flex:1"><option value="nombre" '+(fs==='nombre'?'selected':'')+'>A-Z nombre</option><option value="apellido" '+(fs==='apellido'?'selected':'')+'>A-Z apellido</option><option value="inicio_desc" '+(fs==='inicio_desc'?'selected':'')+'>Ingreso reciente</option><option value="inicio_asc" '+(fs==='inicio_asc'?'selected':'')+'>Ingreso antiguo</option><option value="venc" '+(fs==='venc'?'selected':'')+'>Proximo venc.</option><option value="edad" '+(fs==='edad'?'selected':'')+'>Por edad</option><option value="peso" '+(fs==='peso'?'selected':'')+'>Por peso</option><option value="altura" '+(fs==='altura'?'selected':'')+'>Por altura</option></select>'
    +'<select class="ssel" id="f-est" onchange="renderAlumnos()" style="flex:1"><option value="" '+(fe===''?'selected':'')+'>Estado</option><option value="activo" '+(fe==='activo'?'selected':'')+'>Activos</option><option value="inactivo" '+(fe==='inactivo'?'selected':'')+'>Inactivos</option></select>'
    +'<select class="ssel" id="f-niv" onchange="renderAlumnos()" style="flex:1"><option value="" '+(fn===''?'selected':'')+'>Nivel</option><option value="principiante" '+(fn==='principiante'?'selected':'')+'>Principiante</option><option value="intermedio" '+(fn==='intermedio'?'selected':'')+'>Intermedio</option><option value="avanzado" '+(fn==='avanzado'?'selected':'')+'>Avanzado</option></select>'
    +'<select class="ssel" id="f-sex" onchange="renderAlumnos()" style="flex:1"><option value="" '+(fx===''?'selected':'')+'>Sexo</option><option value="Femenino" '+(fx==='Femenino'?'selected':'')+'>Femenino</option><option value="Masculino" '+(fx==='Masculino'?'selected':'')+'>Masculino</option></select>'
    +'<button class="btn xs sec" onclick="resetFiltros()">x</button></div>'
    +'<div style="font-size:11px;color:var(--text3);margin-bottom:8px">'+list.length+' alumno'+(list.length!==1?'s':'')+' encontrado'+(list.length!==1?'s':'')+'</div>'
    +listH;
}
function setSub(k){curSub=k;renderAlumnos();}
function resetFiltros(){curSub='todos';['srch-a','f-est','f-niv','f-sex'].forEach(id=>{const e=$(id);if(e)e.value='';});const fs=$('f-sort');if(fs)fs.value='nombre';renderAlumnos();}
async function toggleEs(id){const a=alumnos.find(x=>x.id===id);if(!a)return;const n=a.estado==='activo'?'inactivo':'activo';try{await sbU('alumnos',id,{estado:n});a.estado=n;renderAlumnos();if(curTab==='d')renderDash();toast(a.nombre+' > '+n);}catch(e){toast('Error','err');}}

function renderFinanzas(){
  const ing=pagos.reduce((s,p)=>s+Number(p.monto),0);
  const cf=costos.filter(c=>c.tipo==='fijo'),cv=costos.filter(c=>c.tipo==='variable');
  const tf=cf.reduce((s,c)=>s+Number(c.valor),0),tv=cv.reduce((s,c)=>s+Number(c.valor),0),tc=tf+tv;
  const ti=inversiones.reduce((s,i)=>s+Number(i.valor),0),res=ing-tc,mar=ing>0?Math.round(res/ing*100):0;
  const meses={};pagos.forEach(p=>{if(!p.fecha)return;const m=p.fecha.slice(0,7);meses[m]=(meses[m]||0)+Number(p.monto);});
  const mH=Object.entries(meses).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,6).map(([m,v])=>{const[y,mo]=m.split('-');const nm=new Date(y,mo-1).toLocaleDateString('es-AR',{month:'short',year:'2-digit'});return'<div class="fin-row"><div class="fin-l">'+nm+'</div><div class="fin-v c-green">'+fmtM(v)+'</div></div>';}).join('');
  const cfH=cf.map(c=>'<div class="fin-item"><div class="fin-item-l"><div class="fin-item-n">'+c.descripcion+'</div><div class="fin-item-s">'+c.categoria+'</div></div><div class="fin-item-r"><span class="fin-v c-red">'+fmtM(c.valor)+'</span><button class="btn xs sec" onclick="editCosto(\''+c.id+'\')">Editar</button></div></div>').join('');
  const cvH=cv.map(c=>'<div class="fin-item"><div class="fin-item-l"><div class="fin-item-n">'+c.descripcion+'</div><div class="fin-item-s">'+c.categoria+'</div></div><div class="fin-item-r"><span class="fin-v c-ora">'+fmtM(c.valor)+'</span><button class="btn xs sec" onclick="editCosto(\''+c.id+'\')">Editar</button></div></div>').join('');
  const invH=inversiones.map(i=>'<div class="fin-item"><div class="fin-item-l"><div class="fin-item-n">'+i.descripcion+'</div><div class="fin-item-s">'+i.categoria+' - '+fd(i.fecha)+'</div></div><div class="fin-item-r"><span class="fin-v c-pur">'+fmtM(i.valor)+'</span><button class="btn xs sec" onclick="editInv(\''+i.id+'\')">Editar</button></div></div>').join('');
  $('tab-f').innerHTML='<div class="fin-tabs"><button class="fin-tab on" onclick="finTab(this,\'fp-res\')">Resumen</button><button class="fin-tab" onclick="finTab(this,\'fp-cos\')">Costos</button><button class="fin-tab" onclick="finTab(this,\'fp-inv\')">Inversiones</button><button class="fin-tab" onclick="finTab(this,\'fp-bal\')">Balance</button></div>'
    +'<div class="fin-panel on" id="fp-res"><div class="sg4"><div class="stat g-green"><div class="sl">Ingresos</div><div class="sv c-green" style="font-size:16px">'+fmtM(ing)+'</div></div><div class="stat g-red"><div class="sl">Costos</div><div class="sv c-red" style="font-size:16px">'+fmtM(tc)+'</div></div><div class="stat '+(res>=0?'g-green':'g-red')+'"><div class="sl">Resultado</div><div class="sv '+(res>=0?'c-green':'c-red')+'" style="font-size:16px">'+fmtM(res)+'</div></div><div class="stat"><div class="sl">Margen</div><div class="sv '+(mar>=0?'c-green':'c-red')+'">'+mar+'%</div></div></div><div class="sec">Ingresos por mes</div><div class="card"><div class="card-body">'+(mH||'<div class="empty" style="padding:14px">Sin datos</div>')+'</div></div></div>'
    +'<div class="fin-panel" id="fp-cos"><div class="sg2" style="margin-bottom:12px"><div class="stat g-red"><div class="sl">Fijos/mes</div><div class="sv c-red">'+fmtM(tf)+'</div></div><div class="stat"><div class="sl">Variables</div><div class="sv c-ora">'+fmtM(tv)+'</div></div></div><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><div class="sec" style="margin:0">Costos fijos</div><button class="btn xs pri" onclick="openCosto(\'fijo\')">+ Agregar</button></div>'+(cfH||'<div class="empty" style="padding:10px">Sin costos fijos</div>')+'<div style="display:flex;align-items:center;justify-content:space-between;margin:12px 0 8px"><div class="sec" style="margin:0">Costos variables</div><button class="btn xs pri" onclick="openCosto(\'variable\')">+ Agregar</button></div>'+(cvH||'<div class="empty" style="padding:10px">Sin costos variables</div>')+'</div>'
    +'<div class="fin-panel" id="fp-inv"><div class="stat" style="margin-bottom:12px"><div class="sl">Total invertido</div><div class="sv c-pur">'+fmtM(ti)+'</div></div><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:9px"><div class="sec" style="margin:0">Inversiones</div><button class="btn xs pri" onclick="openInv()">+ Agregar</button></div>'+(invH||'<div class="empty">Sin inversiones</div>')+'</div>'
    +'<div class="fin-panel" id="fp-bal"><div class="sec" style="margin-top:0">Estado patrimonial</div><div class="card" style="margin-bottom:12px"><div class="card-body"><div class="fin-row"><div class="fin-l">Activo total</div><div class="fin-v c-green">'+fmtM(ing+ti)+'</div></div><div class="fin-row"><div class="fin-l">Pasivo total</div><div class="fin-v c-red">'+fmtM(tc)+'</div></div><div class="fin-row"><div class="fin-l" style="font-weight:700">Patrimonio neto</div><div class="fin-v '+(ing+ti-tc>=0?'c-green':'c-red')+'" style="font-size:18px">'+fmtM(ing+ti-tc)+'</div></div></div></div><div class="sec">Balance</div><div class="card"><div class="card-body"><div class="fin-row"><div class="fin-l">Ingresos brutos</div><div class="fin-v c-green">'+fmtM(ing)+'</div></div><div class="fin-row"><div class="fin-l">(-) Costos fijos</div><div class="fin-v c-red">-'+fmtM(tf)+'</div></div><div class="fin-row"><div class="fin-l">(-) Costos variables</div><div class="fin-v c-ora">-'+fmtM(tv)+'</div></div><div class="fin-row" style="padding-top:12px;border-top:2px solid var(--border2)"><div class="fin-l" style="font-weight:700">Resultado</div><div class="fin-v '+(res>=0?'c-green':'c-red')+'" style="font-size:18px">'+fmtM(res)+'</div></div></div></div></div>';
}

function renderMkt(){

  const ic={instagram:'📸',whatsapp:'💬',facebook:'👥',email:'📧',referidos:'🤝',otro:'📣'};
  const h=keys.length?keys.map(k=>{const c=campanas[k];return'<div class="mkt-card"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div class="mkt-n">'+c.nombre+'</div><div class="mkt-s">'+(ic[c.canal]||'📣')+' '+c.canal+(c.presupuesto?' - '+fmtM(c.presupuesto):'')+'</div></div><button class="btn xs sec" onclick="editMkt(\''+k+'\')">Editar</button></div>'+(c.objetivo?'<div style="font-size:12px;color:var(--text3);margin-top:6px">Objetivo: '+c.objetivo+'</div>':'')+(c.mensaje?'<div class="mkt-body">'+c.mensaje+'</div>':'')+'<div class="mkt-a"><button class="btn xs pur" onclick="iaParaMkt(\''+k+'\')">Mejorar con IA</button>'+(c.mensaje?'<button class="btn xs sec" onclick="copiarMsg(\''+k+'\')">Copiar</button>':'')+'</div></div>';}).join(''):'<div class="empty">Sin campanas</div>';

function openProgreso(aid){progAid=aid;const a=alumnos.find(x=>x.id===aid);const el=$('mprog-t');if(el)el.textContent='Progreso'+(a?' - '+a.nombre.split(' ')[0]:'');$('prog-f').value=new Date().toISOString().split('T')[0];$('prog-tipo').value='reporte';$('prog-txt').value='';$('prog-peso').value='';openM('m-prog');}
function guardarProgreso(){const txt=($('prog-txt').value||'').trim();if(!txt){toast('El contenido es obligatorio','err');return;}if(!progresos[progAid])progresos[progAid]=[];progresos[progAid].push({fecha:$('prog-f').value,tipo:$('prog-tipo').value,txt,peso:parseFloat($('prog-peso').value)||null,ts:Date.now()});saveProgresos();closeM('m-prog');renderOnline();toast('Progreso guardado');}
function verFoto(aid,idx){const fts=fotos[aid]||[];if(!fts[idx])return;const ov=document.createElement('div');ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:999;display:flex;align-items:center;justify-content:center;cursor:pointer';ov.innerHTML='<img src="'+fts[idx]+'" style="max-width:95vw;max-height:95vh;border-radius:10px;object-fit:contain"><button onclick="this.parentNode.remove()" style="position:absolute;top:16px;right:16px;background:rgba(255,255,255,.1);border:none;border-radius:50%;width:36px;height:36px;color:#fff;font-size:18px;cursor:pointer">x</button>';ov.onclick=e=>{if(e.target===ov)ov.remove();};document.body.appendChild(ov);}
function verTodoProgreso(aid){const a=alumnos.find(x=>x.id===aid);const progs=(progresos[aid]||[]).slice().reverse();const ov=document.createElement('div');ov.className='overlay on';ov.innerHTML='<div class="modal" style="max-height:85dvh"><div class="mh"><h2>Historial - '+(a?a.nombre:'')+'</h2><button class="btn sm sec" onclick="this.closest(\'.overlay\').remove()">x</button></div><div style="overflow-y:auto;flex:1;padding:14px 17px">'+progs.map(p=>'<div class="prog-item" style="margin-bottom:8px"><div class="prog-hdr"><span class="prog-tipo-lbl">'+p.tipo+'</span><span class="prog-date">'+fd(p.fecha)+(p.peso?' - '+p.peso+'kg':'')+'</span></div><div class="prog-txt">'+p.txt+'</div></div>').join('')+'</div></div>';ov.onclick=e=>{if(e.target===ov)ov.remove();};document.body.appendChild(ov);}

function renderOnline(){
  const onl=alumnos.filter(a=>a.modal==='online');
  if(!onl.length){$('tab-o').innerHTML='<div class="empty">No hay alumnos online.<br><br><button class="btn pri" onclick="openAlumnoOnline()">+ Agregar online</button></div>';return;}
  const cards=onl.map(a=>{
    const progs=(progresos[a.id]||[]).slice().reverse();
    const fts=fotos[a.id]||[];
    const lk=waLink(a.tel,waMsg(a));
    const edad=a.nac?(new Date().getFullYear()-parseInt(a.nac.slice(0,4))):null;
    const fotosHtml=fts.slice(0,6).map((f,i)=>'<div class="foto-item" onclick="verFoto('+a.id+','+i+')"><img src="'+f+'" alt="foto" loading="lazy"></div>').join('');
    const progHtml=progs.slice(0,3).map(p=>'<div class="prog-item"><div class="prog-hdr"><span class="prog-tipo-lbl">'+p.tipo+'</span><span class="prog-date">'+fd(p.fecha)+(p.peso?' - '+p.peso+'kg':'')+'</span></div><div class="prog-txt">'+p.txt+'</div></div>').join('');
    const repMsg='Reporte ProClub - '+a.nombre+'\n\nFecha: '+fd(new Date().toISOString().split('T')[0])+'\nPlan: '+a.plan+(a.peso?'\nPeso: '+a.peso+'kg':'')+(progs[0]?'\n\nUltimo registro:\n'+progs[0].txt:'')+'\n\nSeguimos! - ProClub';
    const repLk=waLink(a.tel,repMsg);
    return'<div class="onl-card">'
      +'<div class="onl-top"><div class="onl-av" onclick="addFoto('+a.id+')">'+(fts.length?'<img src="'+fts[fts.length-1]+'" alt="">':'<span>'+ini(a.nombre)+'</span>')+'<div class="onl-av-plus">+</div><input type="file" id="foto-file-'+a.id+'" accept="image/*" multiple onchange="processFoto(event,'+a.id+')" style="display:none"></div><div class="onl-info"><div class="onl-n">'+a.nombre+'</div><div class="onl-s">'+a.plan+' - '+vBadge(a)+'</div>'+(edad||a.peso?'<div class="onl-s" style="font-size:10px">'+[edad?edad+'a':null,a.peso?a.peso+'kg':null,a.altura?a.altura+'cm':null].filter(Boolean).join(' - ')+'</div>':'')+'</div></div>'
      +'<div class="onl-actions">'+(lk?'<a href="'+lk+'" target="_blank" class="btn xs wa2">Chat directo</a>':'')+(repLk?'<a href="'+repLk+'" target="_blank" class="btn xs grn">Reporte WA</a>':'')+'<button class="btn xs pur" onclick="generarPDF('+a.id+')">Ver PDF</button><button class="btn xs" onclick="openProgreso('+a.id+')">+ Progreso</button><button class="btn xs" onclick="editAlumno('+a.id+')">Editar</button></div>'
      +'<div class="prog-sec"><div class="prog-title">Fotos ('+fts.length+')</div><div class="foto-grid">'+fotosHtml+'<div class="foto-item foto-add" onclick="addFoto('+a.id+')" style="gap:4px"><span style="font-size:18px">📷</span><span style="font-size:10px;color:var(--text3)">Agregar</span></div></div></div>'
      +(progs.length?'<div class="prog-sec"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div class="prog-title" style="margin:0">Historial ('+progs.length+')</div>'+(progs.length>3?'<button class="btn xs sec" onclick="verTodoProgreso('+a.id+')">Ver todo</button>':'')+'</div>'+progHtml+'</div>':'<div style="padding:10px 0;text-align:center;font-size:12px;color:var(--text3)">Sin registros - toca + Progreso</div>')
      +'</div>';
  }).join('');
  $('tab-o').innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div class="sec" style="margin:0">Online - '+onl.length+'</div><button class="btn xs pri" onclick="openAlumnoOnline()">+ Online</button></div>'+cards;
}
function openAlumnoOnline(){openAlumno();setTimeout(()=>{$('a-modal').value='online';updatePlanes();},50);}

function generarPDF(aid){
  const a=alumnos.find(x=>x.id===aid);if(!a){toast('Alumno no encontrado','err');return;}
  const progs=(progresos[aid]||[]).slice().reverse();
  const fts=fotos[aid]||[];
  const edad=a.nac?(new Date().getFullYear()-parseInt(a.nac.slice(0,4))):null;
  const win=window.open('','_blank');
  if(!win){toast('Popup bloqueado. Permitilo en el navegador.','err');return;}
  win.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Reporte ProClub - '+a.nombre+'</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,sans-serif;color:#1a1a1a;padding:40px}.header{display:flex;justify-content:space-between;margin-bottom:28px;padding-bottom:20px;border-bottom:3px solid #C8A84B}.brand{font-size:26px;font-weight:800;color:#C8A84B}.fecha{font-size:12px;color:#888}.box{background:#f9f7f2;border-radius:10px;padding:20px;margin-bottom:20px;border-left:4px solid #C8A84B}.nombre{font-size:20px;font-weight:700;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lbl{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:.5px}.val{font-size:13px;font-weight:500}.stitle{font-size:12px;font-weight:700;color:#C8A84B;text-transform:uppercase;letter-spacing:1px;margin:20px 0 10px}.card{border:1px solid #e8e0d0;border-radius:8px;padding:12px;margin-bottom:8px}.ct{font-size:10px;font-weight:700;color:#C8A84B;text-transform:uppercase}.cd{font-size:11px;color:#888}.ctxt{font-size:13px;color:#444;line-height:1.6;margin-top:4px}.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.fimg{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px}.foot{margin-top:30px;padding-top:14px;border-top:1px solid #e8e0d0;display:flex;justify-content:space-between;font-size:11px;color:#aaa}.footbrand{font-weight:700;color:#C8A84B}@media print{body{print-color-adjust:exact;-webkit-print-color-adjust:exact}}</style></head><body>'
    +'<div class="header"><div><div class="brand">ProClub</div><div style="font-size:11px;color:#888;letter-spacing:1px;text-transform:uppercase">Sistema de gestion</div></div><div class="fecha">Generado el '+new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'long',year:'numeric'})+'</div></div>'
    +'<div class="box"><div class="nombre">'+a.nombre+'</div><div class="grid"><div><div class="lbl">Plan</div><div class="val">'+a.plan+'</div></div><div><div class="lbl">Estado</div><div class="val">'+(a.estado==='activo'?'Activo':'Inactivo')+'</div></div><div><div class="lbl">Nivel</div><div class="val">'+a.nivel+'</div></div>'+(edad?'<div><div class="lbl">Edad</div><div class="val">'+edad+' anios</div></div>':'')+(a.peso?'<div><div class="lbl">Peso</div><div class="val">'+a.peso+' kg</div></div>':'')+(a.altura?'<div><div class="lbl">Altura</div><div class="val">'+a.altura+' cm</div></div>':'')+(a.inicio?'<div><div class="lbl">Inicio</div><div class="val">'+fd(a.inicio)+'</div></div>':'')+(a.venc?'<div><div class="lbl">Vencimiento</div><div class="val">'+fd(a.venc)+'</div></div>':'')+'</div>'+(a.notas?'<p style="margin-top:12px;font-size:13px;color:#555;line-height:1.5"><b>Obs:</b> '+a.notas+'</p>':'')+(a.lesion?'<p style="margin-top:6px;font-size:12px;color:#888"><b>Lesiones:</b> '+a.lesion+'</p>':'')+'</div>'
    +(fts.length?'<div class="stitle">Fotos de progreso</div><div class="fgrid">'+fts.slice(0,6).map(f=>'<img class="fimg" src="'+f+'">').join('')+'</div>':'')
    +(progs.length?'<div class="stitle">Historial</div>'+progs.slice(0,8).map(p=>'<div class="card"><div style="display:flex;justify-content:space-between"><span class="ct">'+p.tipo+'</span><span class="cd">'+fd(p.fecha)+(p.peso?' - '+p.peso+'kg':'')+'</span></div><div class="ctxt">'+p.txt+'</div></div>').join(''):'')
    +'<div class="foot"><div class="footbrand">ProClub - San Luis, Argentina</div><div>Generado por ProClub AI</div></div>'
    +'<script>window.onload=()=>{setTimeout(()=>window.print(),400);}<\/script></body></html>');
  win.document.close();toast('PDF listo');
}

function renderConfig(){
  const usersH=usuarios.map(u=>'<div class="user-row"><div><div class="u-name">'+u.nombre+'</div><div class="u-sub">@'+u.username+(u.id===CU?.id?' - (vos)':'')+'</div></div><div style="display:flex;align-items:center;gap:8px"><span class="role-tag '+(u.rol==='admin'?'rt-admin':'rt-coach')+'">'+(u.rol==='admin'?'Admin':'Coach')+'</span><button class="btn xs sec" onclick="editUsuario('+u.id+')">Editar</button></div></div>').join('');
  $('tab-c').innerHTML='<div class="cfg-s"><div class="cfg-hdr">Logo del negocio</div><div class="logo-area"><div class="logo-pick" onclick="document.getElementById(\'cfg-logo-file\').click()">'+(CFG.logoB64?'<img src="'+CFG.logoB64+'" style="display:block">':'<div style="font-size:22px">🏋️</div><div style="font-size:11px;color:var(--text3)">Tocar para subir</div>')+'<input type="file" id="cfg-logo-file" accept="image/*" onchange="cfgLogo(event)"></div>'+(CFG.logoB64?'<button class="btn xs red" onclick="quitarLogo()">Quitar logo</button>':'')+'</div></div>'
    +'<div class="cfg-s"><div class="cfg-hdr">Nombre del negocio</div><div class="cfg-row"><input class="srch" id="cfg-nombre" type="text" value="'+CFG.nombre+'" placeholder="ProClub" style="height:36px;flex:1"><button class="btn sm pri" onclick="guardarNombre()">Guardar</button></div></div>'
    +'<div class="cfg-s"><div class="cfg-hdr">Color de acento</div><div class="cfg-row"><div><div class="cfg-l">Color principal</div><div class="cfg-s2">Botones y elementos destacados</div></div><input type="color" class="color-inp" value="'+(CFG.colorAccent||'#C8A84B')+'" onchange="cambiarColor(this.value)"></div><div class="cfg-row" style="border:none;padding-top:6px"><button class="btn sm sec" onclick="resetColor()">Restaurar dorado</button></div></div>'
    +'<div class="cfg-s"><div class="cfg-hdr">Usuarios del sistema</div>'+usersH+'<div style="padding:12px 15px;border-top:1px solid var(--border)"><button class="btn pri full" onclick="openUsuario()">+ Nuevo usuario</button></div></div>'
    +'<div class="cfg-s"><div class="cfg-hdr">Asistente IA</div><div class="cfg-row"><div><div class="cfg-l">Contador - Estratega - Coach</div><div class="cfg-s2">Reportes y estrategia de crecimiento</div></div><button class="btn sm pur" onclick="openIA()">Abrir</button></div></div>';
}
function cfgLogo(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{CFG.logoB64=ev.target.result;saveCFG();applyTheme();renderConfig();toast('Logo actualizado');};r.readAsDataURL(f);}
function quitarLogo(){CFG.logoB64='';saveCFG();applyTheme();renderConfig();toast('Logo quitado');}
function guardarNombre(){const n=($('cfg-nombre')||{value:''}).value.trim();if(!n){toast('Ingresa un nombre','err');return;}CFG.nombre=n;saveCFG();applyTheme();toast('Nombre actualizado');}
function cambiarColor(v){CFG.colorAccent=v;saveCFG();applyTheme();}
function resetColor(){CFG.colorAccent='#C8A84B';saveCFG();applyTheme();renderConfig();toast('Color restaurado');}
function openUsuario(){editUid=null;$('mu-t').textContent='Nuevo usuario';$('btn-du').style.display='none';['u-nombre','u-user','u-pass'].forEach(id=>{const e=$(id);if(e)e.value='';});$('u-rol').value='coach';openM('m-u');}
function editUsuario(id){editUid=id;const u=usuarios.find(x=>x.id===id);if(!u)return;$('mu-t').textContent='Editar usuario';$('btn-du').style.display=u.id===CU?.id?'none':'flex';$('u-nombre').value=u.nombre||'';$('u-user').value=u.username||'';$('u-pass').value=u.password||'';$('u-rol').value=u.rol||'coach';openM('m-u');}
async function guardarUsuario(){
  const nombre=($('u-nombre').value||'').trim(),username=($('u-user').value||'').trim().toLowerCase(),password=($('u-pass').value||'').trim(),rol=$('u-rol').value;
  if(!nombre||!username||!password){toast('Todos los campos son obligatorios','err');return;}
  if(password.length<4){toast('Contrasena minimo 4 caracteres','err');return;}
  try{if(editUid){const res=await sbU('app_usuarios',editUid,{nombre,username,password,rol});const i=usuarios.findIndex(x=>x.id===editUid);if(i>-1)usuarios[i]={...usuarios[i],...(res[0]||{nombre,username,password,rol})};if(CU&&editUid===CU.id){CU.nombre=nombre;$('tb-dot').textContent=ini(nombre);}toast('Usuario actualizado');}else{const res=await sbP('app_usuarios',{nombre,username,password,rol});usuarios.push(res[0]);toast('Usuario creado');}closeM('m-u');renderConfig();}catch(e){toast('Error - ese usuario ya puede existir','err');}
}
async function elimUsuario(){if(!confirm('Eliminar usuario?'))return;try{await sbD('app_usuarios',editUid);usuarios=usuarios.filter(x=>x.id!==editUid);closeM('m-u');renderConfig();toast('Eliminado');}catch(e){toast('Error','err');}}

function openIA(){iaHistory=[];$('ia-msgs').innerHTML='<div class="msg ai">Hola '+(CU?CU.nombre.split(' ')[0]:'')+'! Soy tu asesor de ProClub. Actuo como contador, estratega y coach. Tengo acceso a los datos reales del negocio. En que te ayudo?</div>';showS('s-ia');}
function closeIA(){showS('s-app');}
function qm(msg){const inp=$('ia-inp');if(inp)inp.value=msg;sendIA();}

async function sendIA(){
  const inp=$('ia-inp'),msg=(inp.value||'').trim();if(!msg)return;
  const send=$('ia-send');
  const msgsEl=$('ia-msgs');
  msgsEl.innerHTML+='<div class="msg usr">'+msg+'</div>';
  iaHistory.push({role:'user',content:msg});
  inp.value='';inp.style.height='auto';send.disabled=true;
  const lid='il'+Date.now();
  msgsEl.innerHTML+='<div class="msg ai load" id="'+lid+'">Analizando...</div>';
  msgsEl.scrollTop=msgsEl.scrollHeight;
  const ing=pagos.reduce((s,p)=>s+Number(p.monto),0);
  const act=alumnos.filter(a=>a.estado==='activo').length;
  const cf=costos.filter(c=>c.tipo==='fijo').reduce((s,c)=>s+Number(c.valor),0);
  const cv=costos.filter(c=>c.tipo==='variable').reduce((s,c)=>s+Number(c.valor),0);
  const tc=cf+cv,res=ing-tc,mar=ing>0?Math.round(res/ing*100):0;
  const ti=inversiones.reduce((s,i)=>s+Number(i.valor),0);
  const meses={};pagos.forEach(p=>{if(!p.fecha)return;const m=p.fecha.slice(0,7);meses[m]=(meses[m]||0)+Number(p.monto);});
  const mStr=Object.entries(meses).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,3).map(([m,v])=>m+': $'+Number(v).toLocaleString('es-AR')).join(', ');
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      model:'claude-sonnet-4-20250514',max_tokens:1200,
      system:'Sos el asesor de '+(CFG.nombre||'ProClub')+', gimnasio boutique en San Luis, Argentina. Franco y Anyelen son los duenos.\nRoles: CONTADOR + ESTRATEGA + COACH FITNESS\nDATOS REALES:\nIngresos: $'+ing.toLocaleString('es-AR')+'\nCostos fijos: $'+cf.toLocaleString('es-AR')+'\nVariables: $'+cv.toLocaleString('es-AR')+'\nResultado: $'+res.toLocaleString('es-AR')+'\nMargen: '+mar+'%\nInversiones: $'+ti.toLocaleString('es-AR')+'\nMeses: '+mStr+'\nAlumnos: '+alumnos.length+' total ('+act+' activos)\nOnline: '+alumnos.filter(a=>a.modal==="online"&&a.estado==="activo").length+'\nPlan Black: '+alumnos.filter(a=>a.modal==="personal"&&a.estado==="activo").length+'\nInstrucciones: Espanol argentino, directo. Usa numeros reales. Max 400 palabras. Termina con UNA accion para HOY.',
      messages:iaHistory
    })});
    const d=await r.json();
    const txt=d.content?.[0]?.text||'Sin respuesta';
    iaHistory.push({role:'assistant',content:txt});
    const el=document.getElementById(lid);
    if(el)el.outerHTML='<div class="msg ai">'+txt.replace(/\n/g,'<br>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')+'</div>';
  }catch(e){const el=document.getElementById(lid);if(el)el.outerHTML='<div class="msg ai" style="color:var(--red)">Error de conexion. Intentalo de nuevo.</div>';}
  finally{send.disabled=false;msgsEl.scrollTop=msgsEl.scrollHeight;}
}
$('ia-inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendIA();}});
$('ia-inp').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,80)+'px';});

init();
</script>
