<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0A0A0A">
<title>ProClub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0A0A0A;--bg2:#111;--bg3:#1a1a1a;
  --gold:#C8A84B;--gold2:#E8C76B;--gold3:#8B6914;--gold4:#1e1a0a;
  --text:#F0E6CC;--text2:#B8A878;--text3:#6B5C3E;
  --border:#2A2218;
  --green:#4BAE52;--red:#E24B4B;--blue:#4B8BE2;--purple:#7B4BE2;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden}
.screen{display:none;flex-direction:column;height:100vh;overflow:hidden}
.screen.on{display:flex}

/* LOGIN */
#s-login{justify-content:center;align-items:center;padding:28px 20px;gap:20px}
.logo-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
#logo-img-login{width:90px;height:90px;object-fit:cover;border-radius:18px;border:2px solid var(--gold3);display:none}
.logo-box{width:90px;height:90px;background:var(--gold4);border:2px solid var(--gold3);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.lp{font-size:30px;font-weight:900;color:var(--gold);letter-spacing:3px}
.lc{font-size:11px;font-weight:700;color:var(--gold3);letter-spacing:5px}
.lsub{font-size:11px;color:var(--text3);letter-spacing:3px;text-transform:uppercase}
.login-card{width:100%;max-width:340px;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px}
.fl{font-size:11px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:5px}
.fi{width:100%;padding:12px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;font-family:inherit;outline:none}
.fi:focus{border-color:var(--gold3)}
.btn-login{width:100%;padding:14px;background:var(--gold);color:#0A0A0A;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-login:active{opacity:.85}
.btn-login:disabled{opacity:.5}
.lerr{color:var(--red);font-size:12px;text-align:center;min-height:16px}

/* LOADING */
#s-loading{justify-content:center;align-items:center;gap:16px}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-txt{font-size:13px;color:var(--text3)}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.tb-l{display:flex;align-items:center;gap:9px}
.tb-logo-img{width:30px;height:30px;object-fit:cover;border-radius:7px;border:1px solid var(--gold3);display:none}
.tb-ico{width:30px;height:30px;background:var(--gold4);border:1px solid var(--gold3);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:var(--gold);letter-spacing:1px}
.tb-t{font-size:15px;font-weight:700;color:var(--gold);letter-spacing:1px}
.tb-r{display:flex;align-items:center;gap:8px}
.tb-un{font-size:12px;font-weight:600;color:var(--gold2);text-align:right}
.tb-ro{font-size:10px;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;text-align:right}
.btn-out{background:transparent;border:1px solid var(--border);border-radius:7px;padding:5px 10px;font-size:11px;color:var(--text3);cursor:pointer;font-family:inherit}

/* BOTTOM NAV */
.bnav{display:flex;background:var(--bg2);border-top:1px solid var(--border);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0px)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 4px;background:transparent;border:none;cursor:pointer;font-family:inherit;color:var(--text3);font-size:10px;min-height:54px}
.nb.on{color:var(--gold)}
.ni{font-size:19px;line-height:1}

/* CONTENT */
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:14px;padding-bottom:24px}
.tab{display:none}
.tab.on{display:block}

/* STATS */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sc{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:13px}
.sl{font-size:10px;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.sv{font-size:24px;font-weight:700}
.cg{color:var(--gold)}.cgn{color:var(--green)}.cr{color:var(--red)}.cb{color:var(--blue)}

/* ALERTS */
.alert-card{background:rgba(226,75,75,.1);border:1px solid rgba(226,75,75,.3);border-radius:11px;padding:12px 13px;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.an{font-size:13px;font-weight:600}
.as{font-size:11px;color:var(--red);margin-top:2px}
.btn-wa{display:inline-flex;align-items:center;gap:5px;padding:8px 12px;background:#25D366;color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0;text-decoration:none}

/* CHART */
.cc{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.ct{font-size:10px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:11px}
.br{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.bl{width:90px;font-size:11px;color:var(--text2);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{flex:1;height:7px;background:var(--bg3);border-radius:4px;overflow:hidden}
.bf{height:100%;border-radius:4px;background:var(--gold)}
.bf2{background:var(--gold3)}
.bn{width:20px;text-align:right;font-size:11px;color:var(--text)}
.stit{font-size:10px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin:14px 0 9px;padding-bottom:6px;border-bottom:1px solid var(--border)}

/* RECENT */
.ri{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.ri:last-child{border-bottom:none}
.rav{width:38px;height:38px;border-radius:50%;background:var(--gold4);border:1px solid var(--gold3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--gold);flex-shrink:0}
.rin{flex:1;min-width:0}
.rn{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{font-size:11px;color:var(--text3);margin-top:2px}
.rm{font-size:14px;font-weight:700;color:var(--green);flex-shrink:0}

/* SUBTABS */
.subtabs{display:flex;gap:6px;margin-bottom:11px;overflow-x:auto;padding-bottom:2px}
.subtabs::-webkit-scrollbar{display:none}
.stab{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--text3);font-family:inherit;white-space:nowrap;flex-shrink:0}
.stab.on{background:var(--gold4);color:var(--gold);border-color:var(--gold3)}

/* TOOLBAR */
.toolbar{display:flex;gap:7px;margin-bottom:11px;align-items:center;flex-wrap:wrap}
.srch{flex:1;min-width:120px;height:38px;padding:0 12px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;font-family:inherit;outline:none}
.srch:focus{border-color:var(--gold3)}
.ssel{height:38px;padding:0 9px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;font-family:inherit;outline:none}
.ssel option{background:var(--bg2)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 13px;height:38px;border-radius:10px;font-size:13px;cursor:pointer;font-family:inherit;border:1px solid var(--border);background:var(--bg2);color:var(--text);white-space:nowrap;flex-shrink:0;text-decoration:none}
.btn:active{opacity:.8}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--gold4);color:var(--gold);border-color:var(--gold3)}
.btn.red{background:rgba(226,75,75,.1);color:var(--red);border-color:rgba(226,75,75,.3)}
.btn.grn{background:rgba(75,174,82,.1);color:var(--green);border-color:rgba(75,174,82,.3)}
.btn.wa2{background:rgba(37,211,102,.1);color:#25D366;border-color:rgba(37,211,102,.35)}
.btn.pur{background:rgba(123,75,226,.1);color:var(--purple);border-color:rgba(123,75,226,.3)}
.btn.sm{height:34px;padding:0 11px;font-size:12px;border-radius:8px}
.btn.xs{height:28px;padding:0 9px;font-size:11px;border-radius:7px}

/* ALUMNO CARD */
.ac{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px}
.ac-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ac-av{width:40px;height:40px;border-radius:50%;background:var(--gold4);border:1px solid var(--gold3);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--gold);flex-shrink:0}
.ac-i{flex:1;min-width:0}
.ac-n{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-s{font-size:11px;color:var(--text3);margin-top:2px}
.ac-b{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.ac-a{display:flex;gap:6px;flex-wrap:wrap}

/* BADGES */
.badge{display:inline-block;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:600}
.bp{background:rgba(75,139,226,.12);color:#7babf0;border:1px solid rgba(75,139,226,.25)}
.bo{background:rgba(123,75,226,.12);color:#a87bf0;border:1px solid rgba(123,75,226,.25)}
.b1{background:var(--gold4);color:var(--gold2);border:1px solid rgba(200,168,75,.25)}
.btr{background:rgba(226,139,75,.12);color:#f0b07a;border:1px solid rgba(226,139,75,.25)}
.bac{background:rgba(75,174,82,.12);color:var(--green);border:1px solid rgba(75,174,82,.25)}
.bin{background:rgba(226,75,75,.1);color:#f07070;border:1px solid rgba(226,75,75,.25)}
.bpr{background:rgba(107,92,62,.2);color:var(--text2)}
.bme{background:var(--gold4);color:var(--gold)}
.bav{background:rgba(75,174,82,.1);color:var(--green)}
.bvr{background:rgba(226,75,75,.12);color:var(--red);border:1px solid rgba(226,75,75,.3)}
.bok{background:rgba(75,174,82,.1);color:var(--green);border:1px solid rgba(75,174,82,.25)}

/* PAGO CARD */
.pgc{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.pav{width:38px;height:38px;border-radius:50%;background:var(--gold4);border:1px solid var(--gold3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--gold);flex-shrink:0}
.pin{flex:1;min-width:0}
.pn{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps{font-size:11px;color:var(--text3);margin-top:2px}
.pr2{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.pm{font-size:15px;font-weight:700;color:var(--gold)}

/* PROMO CARD */
.prc{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.prt{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px}
.prn{font-size:15px;font-weight:700;color:var(--gold2)}
.prp{font-size:20px;font-weight:700;color:var(--gold)}
.prd{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:9px}
.prs{display:flex;gap:16px;font-size:12px;color:var(--text3);margin-bottom:9px}
.prs span{color:var(--text);font-weight:600}
.pra{display:flex;gap:6px;padding-top:9px;border-top:1px solid var(--border)}

/* CONFIG */
.cfg-section{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.cfg-title{font-size:12px;font-weight:700;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.cfg-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.cfg-row:last-child{border-bottom:none;padding-bottom:0}
.cfg-lbl{font-size:13px;color:var(--text)}
.cfg-sub{font-size:11px;color:var(--text3);margin-top:2px}
.color-pick{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);cursor:pointer;padding:2px;background:transparent}
.user-card{background:var(--bg3);border-radius:10px;padding:12px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.user-info .un{font-size:13px;font-weight:600}
.user-info .ur{font-size:11px;color:var(--text3);margin-top:2px}
.role-badge{padding:3px 8px;border-radius:8px;font-size:11px;font-weight:600}
.rb-admin{background:rgba(200,168,75,.15);color:var(--gold);border:1px solid rgba(200,168,75,.3)}
.rb-coach{background:rgba(75,139,226,.12);color:#7babf0;border:1px solid rgba(75,139,226,.25)}
.logo-upload-area{border:2px dashed var(--border);border-radius:12px;padding:24px;text-align:center;cursor:pointer;transition:border-color .2s;margin-bottom:8px}
.logo-upload-area:hover{border-color:var(--gold3)}
.logo-upload-area input{display:none}
.logo-preview{width:80px;height:80px;object-fit:cover;border-radius:12px;border:2px solid var(--gold3);margin-bottom:8px}

/* IA CHAT */
#s-ia{flex-direction:column;height:100vh}
.ia-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.ia-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--purple)}
.ia-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.6}
.msg.user{align-self:flex-end;background:var(--gold4);color:var(--gold2);border:1px solid rgba(200,168,75,.2);border-radius:14px 14px 4px 14px}
.msg.ai{align-self:flex-start;background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:14px 14px 14px 4px}
.msg.ai.loading{color:var(--text3)}
.ia-input-area{display:flex;gap:8px;padding:12px 14px;background:var(--bg2);border-top:1px solid var(--border);flex-shrink:0;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.ia-inp{flex:1;padding:10px 13px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;font-family:inherit;outline:none;resize:none;max-height:100px}
.ia-inp:focus{border-color:var(--purple)}
.ia-send{width:40px;height:40px;background:var(--purple);border:none;border-radius:10px;color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.ia-send:disabled{opacity:.4}
.ia-quick{display:flex;gap:6px;padding:8px 14px;overflow-x:auto;flex-shrink:0}
.ia-quick::-webkit-scrollbar{display:none}
.qbtn{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:6px 11px;font-size:11px;color:var(--text2);cursor:pointer;white-space:nowrap;font-family:inherit;flex-shrink:0}
.qbtn:active{border-color:var(--purple);color:var(--purple)}

/* OVERLAY */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.modal{background:var(--bg2);border-radius:20px 20px 0 0;border:1px solid var(--border);width:100%;max-width:600px;max-height:92vh;display:flex;flex-direction:column}
.mh{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
.mh h2{font-size:15px;font-weight:700;color:var(--gold)}
.mb{padding:15px 18px;overflow-y:auto;flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mb.s1{grid-template-columns:1fr}
.full{grid-column:1/-1}
.slbl{font-size:10px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;grid-column:1/-1;margin-top:5px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.field label{display:block;font-size:10px;color:var(--text3);margin-bottom:4px;letter-spacing:.5px;text-transform:uppercase}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;font-family:inherit;outline:none;-webkit-appearance:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold3)}
.field textarea{resize:vertical;min-height:60px}
.field select option{background:var(--bg2)}
.mf{padding:13px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0;padding-bottom:max(13px,env(safe-area-inset-bottom))}

/* TOAST */
.toast{position:fixed;bottom:74px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:10px;font-size:13px;z-index:500;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:rgba(75,174,82,.5);color:var(--green)}
.toast.err{border-color:rgba(226,75,75,.5);color:var(--red)}

.empty{text-align:center;padding:36px 20px;color:var(--text3);font-size:14px}
@media(max-width:380px){.mb{grid-template-columns:1fr}.full{grid-column:1}}
</style>
</head>
<body>

<!-- LOADING -->
<div class="screen on" id="s-loading">
  <div class="spinner"></div>
  <div class="load-txt">Cargando ProClub...</div>
</div>

<!-- LOGIN -->
<div class="screen" id="s-login">
  <div class="logo-wrap">
    <img id="logo-img-login" src="" alt="Logo">
    <div class="logo-box" id="logo-box-login">
      <div class="lp" id="login-pro">PRO</div>
      <div class="lc" id="login-club">CLUB</div>
    </div>
    <div class="lsub" id="login-nombre-negocio">Sistema de gestión</div>
  </div>
  <div class="login-card">
    <div class="field"><label class="fl">Usuario</label><input class="fi" id="lu" type="text" placeholder="Tu usuario" autocomplete="off" autocapitalize="none"></div>
    <div class="field"><label class="fl">Contraseña</label><input class="fi" id="lp" type="password" placeholder="••••••••"></div>
    <div class="lerr" id="lerr"></div>
    <button class="btn-login" id="lbtn" onclick="doLogin()">Ingresar</button>
  </div>
</div>

<!-- APP -->
<div class="screen" id="s-app">
  <div class="topbar">
    <div class="tb-l">
      <img class="tb-logo-img" id="tb-logo-img" src="" alt="">
      <div class="tb-ico" id="tb-ico">PC</div>
      <span class="tb-t" id="tb-nombre">PROCLUB</span>
    </div>
    <div class="tb-r">
      <div><div class="tb-un" id="tbu">—</div><div class="tb-ro" id="tbr">—</div></div>
      <button class="btn-out" onclick="doLogout()">Salir</button>
    </div>
  </div>
  <div class="content" id="content">
    <div class="tab on" id="tab-d"></div>
    <div class="tab" id="tab-a"></div>
    <div class="tab" id="tab-p"></div>
    <div class="tab" id="tab-v"></div>
    <div class="tab" id="tab-cfg"></div>
  </div>
  <div class="bnav" id="bnav"></div>
</div>

<!-- IA CHAT -->
<div class="screen" id="s-ia">
  <div class="ia-header">
    <div class="ia-title">🤖 Asistente ProClub</div>
    <button class="btn sm" onclick="closeIA()">✕ Cerrar</button>
  </div>
  <div class="ia-quick">
    <button class="qbtn" onclick="quickMsg('Redactá un mensaje para recordarle a un alumno que su cuota vence esta semana')">📨 Recordatorio cuota</button>

// ── HELPERS ───────────────────────────────────────────────
const $=id=>document.getElementById(id);
const fd=d=>d?d.split('-').reverse().join('/'):'—';
const ini=n=>(n||'?').split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase();

function dias(venc){
  if(!venc)return null;
  const h=new Date();h.setHours(0,0,0,0);
  const v=new Date(venc);v.setHours(0,0,0,0);
  return Math.round((v-h)/864e5);
}
function waLink(tel,msg){
  const num=(tel||'').replace(/\D/g,'');
  if(!num||num.length<8)return null;
  return `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
}
function waMsg(a){
  const d=dias(a.venc),nom=a.nombre.split(' ')[0];
  if(d===null)return `Hola ${nom}! 👋 Te escribimos desde ProClub. ¿Renovamos tu plan?`;
  if(d<=0)return `Hola ${nom}! 👋 Tu membresía ProClub venció el ${fd(a.venc)}. ¡Hablemos para renovar! 💪`;
  return `Hola ${nom}! 👋 Tu membresía ProClub vence en ${d} día${d!==1?'s':''}. ¡Coordinamos la renovación! 💪`;
}
function showToast(msg,tipo='ok'){
  const t=$('toast');
  t.textContent=msg;t.className=`toast ${tipo} show`;
  clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',2400);
}
function setLoading(btn,on){
  if(!btn)return;
  btn.disabled=on;
  if(on){btn._t=btn.textContent;btn.textContent='...';}
  else btn.textContent=btn._t||btn.textContent;
}

function applyConfig(){

  document.documentElement.style.setProperty('--gold3',darken(c.colorGold,15));

  // nombre
  $('tb-nombre').textContent=c.nombre;
  const nn=$('login-nombre-negocio');if(nn)nn.textContent='Sistema de gestión · '+c.nombre;

    const li=$('logo-img-login');if(li){li.src=c.logoB64;li.style.display='block';}

  } else {

    const li=$('logo-img-login');if(li)li.style.display='none';
    const lb=$('logo-box-login');if(lb)lb.style.display='flex';
  }
  // guardar local
  try{localStorage.setItem('proclub_cfg',JSON.stringify(c));}catch(e){}
}

function lighten(hex,amt){
  let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `#${Math.min(255,r+amt).toString(16).padStart(2,'0')}${Math.min(255,g+amt).toString(16).padStart(2,'0')}${Math.min(255,b+amt).toString(16).padStart(2,'0')}`;
}
function darken(hex,amt){
  let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `#${Math.max(0,r-amt).toString(16).padStart(2,'0')}${Math.max(0,g-amt).toString(16).padStart(2,'0')}${Math.max(0,b-amt).toString(16).padStart(2,'0')}`;
}
function hexAlpha(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ── LOGIN ─────────────────────────────────────────────────
async function doLogin(){
  const u=$('lu').value.trim().toLowerCase();
  const p=$('lp').value;
  $('lerr').textContent='';
  if(!u||!p){$('lerr').textContent='Ingresá usuario y contraseña';return;}
  const btn=$('lbtn');setLoading(btn,true);
  try{
    const res=await sbGet('app_usuarios',`username=eq.${u}&password=eq.${p}&select=*`);
    if(!res||!res.length){$('lerr').textContent='Usuario o contraseña incorrectos';return;}
    CU={...res[0]};
    $('tbu').textContent=CU.nombre;
    $('tbr').textContent=CU.rol==='admin'?'Administrador':'Entrenadora';
    buildNav();showScreen('s-app');showTab('d');
  }catch(e){$('lerr').textContent='Error de conexión.';}
  finally{setLoading(btn,false);}
}
$('lp').onkeydown=e=>{if(e.key==='Enter')doLogin();};
$('lu').onkeydown=e=>{if(e.key==='Enter')$('lp').focus();};

function doLogout(){
  CU=null;showScreen('s-login');
  $('lu').value='';$('lp').value='';
}

const NAVS=[

function showTab(id){

// ── DASHBOARD ─────────────────────────────────────────────
function renderDash(){
  const act=alumnos.filter(a=>a.estado==='activo');
  const ing=pagos.reduce((s,p)=>s+Number(p.monto),0);
  const tot=alumnos.length||1;
  const xv=act.filter(a=>{const d=dias(a.venc);return d!==null&&d<=5;}).sort((a,b)=>dias(a.venc)-dias(b.venc));

  const alerts=xv.length?`<div style="margin-bottom:14px">
    <div style="font-size:10px;color:var(--red);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:6px">
      <div style="width:7px;height:7px;border-radius:50%;background:var(--red)"></div>
      Vencimientos próximos (${xv.length})
    </div>
    ${xv.map(a=>{
      const d=dias(a.venc);
      const txt=d<=0?`Venció hace ${Math.abs(d)}d`:`Vence en ${d}d`;
      const link=waLink(a.tel,waMsg(a));
      return `<div class="alert-card">
        <div><div class="an">${a.nombre}</div><div class="as">${txt} · ${a.plan}</div></div>
        ${link?`<a href="${link}" target="_blank" class="btn-wa">💬 Avisar</a>`:''}
      </div>`;
    }).join('')}
  </div>`:'';

  const modMap={presencial:'Presencial',online:'Online',personal:'1 a 1',transformacion:'Transformación'};
  const modH=Object.entries(modMap).map(([k,l])=>{
    const c=alumnos.filter(a=>a.modal===k).length;
    const p=Math.round(c/tot*100);
    return `<div class="br"><div class="bl">${l}</div><div class="bt"><div class="bf" style="width:${p}%"></div></div><div class="bn">${c}</div></div>`;
  }).join('');

  const nivH=['principiante','intermedio','avanzado'].map(k=>{
    const c=alumnos.filter(a=>a.nivel===k).length;
    const p=Math.round(c/tot*100);
    return `<div class="br"><div class="bl" style="text-transform:capitalize">${k}</div><div class="bt"><div class="bf bf2" style="width:${p}%"></div></div><div class="bn">${c}</div></div>`;
  }).join('');

  const recH=pagos.slice(0,5).map(pg=>{
    const a=alumnos.find(x=>x.id===pg.aid);
    return `<div class="ri">
      <div class="rav">${a?ini(a.nombre):'?'}</div>
      <div class="rin"><div class="rn">${a?a.nombre:'—'}</div><div class="rs">${fd(pg.fecha)} · ${pg.concepto}</div></div>
      <div class="rm">$${Number(pg.monto).toLocaleString('es-AR')}</div>
    </div>`;
  }).join('');

  $('tab-d').innerHTML=`
    ${alerts}
    <div style="display:flex;justify-content:flex-end;margin-bottom:12px">
      <button class="btn sm pur" onclick="openIA()">🤖 Asistente IA</button>
    </div>
    <div class="sg">
      <div class="sc"><div class="sl">Total</div><div class="sv cb">${alumnos.length}</div></div>
      <div class="sc"><div class="sl">Activos</div><div class="sv cgn">${act.length}</div></div>
      <div class="sc"><div class="sl">Inactivos</div><div class="sv cr">${alumnos.length-act.length}</div></div>
      <div class="sc"><div class="sl">Ingresos</div><div class="sv cg" style="font-size:18px">$${ing.toLocaleString('es-AR')}</div></div>
    </div>
    <div class="cc"><div class="ct">Por modalidad</div>${modH}</div>
    <div class="cc"><div class="ct">Por nivel</div>${nivH}</div>
    <div class="stit">Pagos recientes</div>
    ${recH||'<div class="empty">Sin pagos</div>'}`;
}

function renderAlumnos(){
  const q=($('srch-a')||{value:''}).value.toLowerCase();
  const fe=($('f-est')||{value:''}).value;
  let list=alumnos.filter(a=>{
    if(curSub!=='todos'&&a.modal!==curSub)return false;

    if(q&&!a.nombre.toLowerCase().includes(q))return false;
    return true;
  });
  const subH=['todos','presencial','online','personal','transformacion'].map(k=>{
    const l={todos:'Todos',presencial:'Presencial',online:'Online',personal:'1 a 1',transformacion:'Transformación'}[k];
    return `<button class="stab${curSub===k?' on':''}" onclick="setSub('${k}')">${l}</button>`;
  }).join('');
  const listH=list.length?list.map(a=>{
    const link=waLink(a.tel,waMsg(a));
    return `<div class="ac">
      <div class="ac-top">
        <div class="ac-av">${ini(a.nombre)}</div>
        <div class="ac-i"><div class="ac-n">${a.nombre}</div><div class="ac-s">${a.plan} · ${fd(a.inicio)}</div></div>
      </div>
      <div class="ac-b">${modBadge(a.modal)} ${esBadge(a.estado)} ${nivBadge(a.nivel)} ${vencBadge(a)}</div>
      <div class="ac-a">
        <button class="btn xs" onclick="editAlumno(${a.id})">✎ Editar</button>
        <button class="btn xs ${a.estado==='activo'?'red':'grn'}" onclick="toggleEs(${a.id})">${a.estado==='activo'?'Inactivar':'Activar'}</button>
        ${link?`<a href="${link}" target="_blank" class="btn xs wa2">💬 WhatsApp</a>`:''}
        ${link&&a.estado==='activo'?`<a href="${link}" target="_blank" class="btn xs" style="color:var(--red);border-color:rgba(226,75,75,.3);background:rgba(226,75,75,.08)">📨 Recordatorio</a>`:''}
      </div>
    </div>`;
  }).join(''):'<div class="empty">Sin alumnos que coincidan</div>';

  $('tab-a').innerHTML=`
    <div class="subtabs">${subH}</div>
    <div class="toolbar">
      <input class="srch" id="srch-a" type="text" placeholder="🔍 Buscar..." oninput="renderAlumnos()" value="${q}">
      <select class="ssel" id="f-est" onchange="renderAlumnos()">
        <option value="">Estado</option>
        <option value="activo" ${fe==='activo'?'selected':''}>Activos</option>
        <option value="inactivo" ${fe==='inactivo'?'selected':''}>Inactivos</option>
      </select>
      <button class="btn sm pri" onclick="openAlumno()">+ Nuevo</button>
    </div>
    ${listH}`;
}

function setSub(k){curSub=k;renderAlumnos();}

async function toggleEs(id){
  const a=alumnos.find(x=>x.id===id);if(!a)return;
  const nuevo=a.estado==='activo'?'inactivo':'activo';
  try{
    await sbPatch('alumnos',id,{estado:nuevo});
    a.estado=nuevo;renderAlumnos();renderDash();
    showToast(`${a.nombre} → ${nuevo}`);
  }catch(e){showToast('Error al actualizar','err');}
}

function openAlumno(){
  editId=null;$('ma-t').textContent='Nuevo alumno';$('btn-baja').style.display='none';
  ['nombre','tel','lesion','patol','meds','ciclo','notas'].forEach(k=>$('a-'+k).value='');
  $('a-peso').value='';$('a-alt').value='';
  $('a-inicio').value=new Date().toISOString().split('T')[0];
  $('a-nac').value='';$('a-venc').value='';$('a-sexo').value='';
  $('a-modal').value='presencial';$('a-plan').value='Mensual';
  $('a-nivel').value='principiante';$('a-estado').value='activo';
  openM('m-a');
}

function editAlumno(id){
  editId=id;const a=alumnos.find(x=>x.id===id);if(!a)return;
  $('ma-t').textContent='Editar alumno';$('btn-baja').style.display='flex';
  $('a-nombre').value=a.nombre||'';$('a-tel').value=a.tel||'';
  $('a-inicio').value=a.inicio||'';$('a-venc').value=a.venc||'';
  $('a-nac').value=a.nac||'';$('a-sexo').value=a.sexo||'';
  $('a-peso').value=a.peso||'';$('a-alt').value=a.altura||'';
  $('a-modal').value=a.modal||'presencial';$('a-plan').value=a.plan||'Mensual';
  $('a-nivel').value=a.nivel||'principiante';$('a-estado').value=a.estado||'activo';
  $('a-lesion').value=a.lesion||'';$('a-patol').value=a.patol||'';
  $('a-meds').value=a.meds||'';$('a-ciclo').value=a.ciclo||'';
  $('a-notas').value=a.notas||'';
  openM('m-a');
}

async function guardarAlumno(){
  const nombre=$('a-nombre').value.trim();
  if(!nombre){showToast('El nombre es obligatorio','err');return;}
  const btn=$('btn-ga');setLoading(btn,true);
  const obj={nombre,tel:$('a-tel').value.trim(),inicio:$('a-inicio').value||null,venc:$('a-venc').value||null,nac:$('a-nac').value||null,sexo:$('a-sexo').value,peso:parseFloat($('a-peso').value)||null,altura:parseFloat($('a-alt').value)||null,modal:$('a-modal').value,plan:$('a-plan').value,nivel:$('a-nivel').value,estado:$('a-estado').value,lesion:$('a-lesion').value,patol:$('a-patol').value,meds:$('a-meds').value,ciclo:$('a-ciclo').value,notas:$('a-notas').value};
  try{
    if(editId){const res=await sbPatch('alumnos',editId,obj);const idx=alumnos.findIndex(x=>x.id===editId);if(idx>-1)alumnos[idx]={...alumnos[idx],...(res[0]||obj)};showToast('Alumno actualizado ✓');}
    else{const res=await sbPost('alumnos',obj);alumnos.push(res[0]);alumnos.sort((a,b)=>a.nombre.localeCompare(b.nombre));showToast('Alumno creado ✓');}
    closeM('m-a');renderAlumnos();renderDash();
  }catch(e){showToast('Error al guardar','err');}
  finally{setLoading(btn,false);}
}

async function darBaja(){
  if(!confirm('¿Dar de baja a este alumno?'))return;
  try{
    await sbPatch('alumnos',editId,{estado:'inactivo'});
    const a=alumnos.find(x=>x.id===editId);if(a)a.estado='inactivo';
    showToast('Alumno dado de baja');closeM('m-a');renderAlumnos();renderDash();
  }catch(e){showToast('Error','err');}
}

// ── PAGOS ─────────────────────────────────────────────────
function renderPagos(){
  const fa=($('f-apago')||{value:''}).value;
  const faid=parseInt(fa)||null;
  const selOpts='<option value="">Todos los alumnos</option>'+alumnos.map(a=>`<option value="${a.id}" ${faid===a.id?'selected':''}>${a.nombre}</option>`).join('');
  let list=faid?pagos.filter(p=>p.aid===faid):pagos;
  const listH=list.length?list.map(pg=>{
    const a=alumnos.find(x=>x.id===pg.aid);
    return `<div class="pgc">
      <div class="pav">${a?ini(a.nombre):'?'}</div>
      <div class="pin"><div class="pn">${a?a.nombre:'—'}</div><div class="ps">${fd(pg.fecha)} · ${pg.concepto||'Pago'}</div></div>
      <div class="pr2"><div class="pm">$${Number(pg.monto).toLocaleString('es-AR')}</div><button class="btn xs red" onclick="elimPago(${pg.id})">✕ Eliminar</button></div>
    </div>`;
  }).join(''):'<div class="empty">Sin pagos registrados</div>';

  $('tab-p').innerHTML=`
    <div class="toolbar">
      <select class="ssel" id="f-apago" style="flex:1;height:38px" onchange="renderPagos()">${selOpts}</select>
      <button class="btn sm pri" onclick="openPago()">+ Pago</button>
    </div>${listH}`;
}

function openPago(){
  $('pm-a').innerHTML=alumnos.map(a=>`<option value="${a.id}">${a.nombre}</option>`).join('');
  $('pm-m').value='';$('pm-c').value='';
  $('pm-f').value=new Date().toISOString().split('T')[0];
  const v=new Date();v.setMonth(v.getMonth()+1);
  $('pm-v').value=v.toISOString().split('T')[0];
  openM('m-p');
}

async function guardarPago(){
  const aidv=parseInt($('pm-a').value);
  const monto=parseFloat($('pm-m').value);
  const fecha=$('pm-f').value;
  const venc=$('pm-v').value;
  const concepto=$('pm-c').value.trim();
  if(!aidv||!monto||!fecha){showToast('Alumno, monto y fecha son obligatorios','err');return;}
  const btn=$('btn-gp');setLoading(btn,true);
  try{
    const res=await sbPost('pagos',{aid:aidv,monto,fecha,concepto:concepto||'Pago'});
    pagos.unshift(res[0]);
    if(venc){await sbPatch('alumnos',aidv,{venc});const a=alumnos.find(x=>x.id===aidv);if(a)a.venc=venc;}
    closeM('m-p');renderPagos();renderDash();showToast('Pago registrado ✓');
  }catch(e){showToast('Error al registrar','err');}
  finally{setLoading(btn,false);}
}

async function elimPago(id){
  if(!confirm('¿Eliminar este pago?'))return;
  try{
    await sbDel('pagos',id);
    const idx=pagos.findIndex(p=>p.id===id);if(idx>-1)pagos.splice(idx,1);
    renderPagos();renderDash();showToast('Pago eliminado');
  }catch(e){showToast('Error al eliminar','err');}
}

// ── VENTAS ────────────────────────────────────────────────
function renderPromos(){
  const h=promos.length?promos.map(p=>`
    <div class="prc">
      <div class="prt"><div class="prn">${p.nombre}</div><div class="prp">$${Number(p.precio).toLocaleString('es-AR')}</div></div>
      <div class="prd">${p.desc_texto||''}</div>
      <div class="prs">Ventas: <span>${p.ventas}</span>&nbsp;·&nbsp;Recaudado: <span>$${(p.ventas*Number(p.precio)).toLocaleString('es-AR')}</span></div>
      <div class="pra">
        <button class="btn sm grn" onclick="addVenta(${p.id})">+ Registrar venta</button>
        <button class="btn sm red" onclick="elimPromo(${p.id})" style="margin-left:auto">Eliminar</button>
      </div>
    </div>`).join(''):'<div class="empty">No hay promociones</div>';
  $('tab-v').innerHTML=`<div class="toolbar" style="justify-content:flex-end"><button class="btn sm pri" onclick="openPromo()">+ Nueva promo</button></div>${h}`;
}

async function addVenta(id){
  const p=promos.find(x=>x.id===id);if(!p)return;
  try{await sbPatch('promos',id,{ventas:p.ventas+1});p.ventas++;renderPromos();showToast(`Venta registrada · $${Number(p.precio).toLocaleString('es-AR')}`);}
  catch(e){showToast('Error','err');}
}
function openPromo(){$('pr-n').value='';$('pr-p').value='';$('pr-d').value='';openM('m-pr');}
async function guardarPromo(){
  const nombre=$('pr-n').value.trim(),precio=parseFloat($('pr-p').value);
  if(!nombre||!precio){showToast('Nombre y precio son obligatorios','err');return;}
  try{const res=await sbPost('promos',{nombre,precio,desc_texto:$('pr-d').value.trim(),ventas:0});promos.unshift(res[0]);closeM('m-pr');renderPromos();showToast('Promoción creada ✓');}
  catch(e){showToast('Error al crear','err');}
}
async function elimPromo(id){
  if(!confirm('¿Eliminar esta promoción?'))return;
  try{await sbDel('promos',id);const idx=promos.findIndex(p=>p.id===id);if(idx>-1)promos.splice(idx,1);renderPromos();showToast('Promoción eliminada');}
  catch(e){showToast('Error al eliminar','err');}
}

// ── CONFIGURACIÓN ─────────────────────────────────────────
function renderConfig(){
  const usersH=usuarios.map(u=>`
    <div class="user-card">
      <div class="user-info">
        <div class="un">${u.nombre}</div>
        <div class="ur">@${u.username}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="role-badge ${u.rol==='admin'?'rb-admin':'rb-coach'}">${u.rol==='admin'?'Admin':'Coach'}</span>
        ${u.username!=='franco'?`<button class="btn xs" onclick="editUsuario(${u.id})">✎</button>`:''}
      </div>
    </div>`).join('');

  $('tab-cfg').innerHTML=`
    <!-- USUARIOS -->
    <div class="cfg-section">
      <div class="cfg-title">👥 Usuarios del sistema</div>
      ${usersH}
      <button class="btn sm pri" style="width:100%;margin-top:8px;justify-content:center" onclick="openUsuario()">+ Nuevo usuario</button>
    </div>

    <!-- LOGO -->
    <div class="cfg-section">
      <div class="cfg-title">🖼️ Logo del negocio</div>
      <div class="logo-upload-area" onclick="$('logo-file').click()">
        ${appConfig.logoB64?`<img src="${appConfig.logoB64}" class="logo-preview"><br>`:''}
        <div style="font-size:13px;color:var(--text2)">📁 Tocá para subir tu logo</div>
        <div style="font-size:11px;color:var(--text3);margin-top:4px">PNG o JPG — se muestra en el header y el login</div>
        <input type="file" id="logo-file" accept="image/*" onchange="subirLogo(event)">
      </div>
      ${appConfig.logoB64?`<button class="btn sm red" style="width:100%;justify-content:center" onclick="quitarLogo()">Quitar logo</button>`:''}
    </div>

    <!-- COLORES -->
    <div class="cfg-section">
      <div class="cfg-title">🎨 Colores de la app</div>
      <div class="cfg-row">
        <div><div class="cfg-lbl">Color principal (dorado)</div><div class="cfg-sub">Botones, íconos y acentos</div></div>
        <input type="color" class="color-pick" value="${appConfig.colorGold}" onchange="cambiarColor('colorGold',this.value)">
      </div>
      <div class="cfg-row">
        <div><div class="cfg-lbl">Color de fondo</div><div class="cfg-sub">Fondo general de la app</div></div>
        <input type="color" class="color-pick" value="${appConfig.colorBg||'#0A0A0A'}" onchange="cambiarColor('colorBg',this.value)">
      </div>
      <button class="btn sm" style="margin-top:12px" onclick="resetColores()">↺ Restaurar colores originales</button>
    </div>

    <!-- NOMBRE -->
    <div class="cfg-section">
      <div class="cfg-title">✏️ Nombre del negocio</div>
      <div style="display:flex;gap:8px">
        <input class="srch" id="cfg-nombre" type="text" placeholder="Ej: PROCLUB" value="${appConfig.nombre}" style="flex:1;height:38px">
        <button class="btn sm pri" onclick="guardarNombre()">Guardar</button>
      </div>
    </div>

    <!-- IA -->
    <div class="cfg-section">
      <div class="cfg-title">🤖 Asistente IA</div>
      <div class="cfg-row">
        <div><div class="cfg-lbl">Abrir asistente</div><div class="cfg-sub">Análisis, mensajes, consejos</div></div>
        <button class="btn sm pur" onclick="openIA()">Abrir IA</button>
      </div>
    </div>`;
}

function subirLogo(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    appConfig.logoB64=ev.target.result;
    applyConfig();renderConfig();showToast('Logo actualizado ✓');
  };
  r.readAsDataURL(f);
}
function quitarLogo(){appConfig.logoB64='';applyConfig();renderConfig();showToast('Logo quitado');}
function cambiarColor(k,v){appConfig[k]=v;applyConfig();}
function resetColores(){appConfig.colorGold='#C8A84B';appConfig.colorBg='#0A0A0A';applyConfig();renderConfig();showToast('Colores restaurados');}
function guardarNombre(){
  const n=$('cfg-nombre').value.trim();
  if(!n){showToast('Ingresá un nombre','err');return;}
  appConfig.nombre=n;applyConfig();showToast('Nombre actualizado ✓');
}

// ── USUARIOS ──────────────────────────────────────────────
function openUsuario(){
  editUid=null;$('mu-t').textContent='Nuevo usuario';$('btn-du').style.display='none';
  $('u-nombre').value='';$('u-user').value='';$('u-pass').value='';$('u-rol').value='coach';
  openM('m-u');
}
function editUsuario(id){
  editUid=id;const u=usuarios.find(x=>x.id===id);if(!u)return;
  $('mu-t').textContent='Editar usuario';$('btn-du').style.display='flex';
  $('u-nombre').value=u.nombre||'';$('u-user').value=u.username||'';
  $('u-pass').value=u.password||'';$('u-rol').value=u.rol||'coach';
  openM('m-u');
}
async function guardarUsuario(){
  const nombre=$('u-nombre').value.trim();
  const username=$('u-user').value.trim().toLowerCase();
  const password=$('u-pass').value.trim();
  const rol=$('u-rol').value;
  if(!nombre||!username||!password){showToast('Todos los campos son obligatorios','err');return;}
  if(password.length<4){showToast('La contraseña debe tener al menos 4 caracteres','err');return;}
  try{
    if(editUid){
      const res=await sbPatch('app_usuarios',editUid,{nombre,username,password,rol});
      const idx=usuarios.findIndex(x=>x.id===editUid);if(idx>-1)usuarios[idx]={...usuarios[idx],...(res[0]||{})};
      showToast('Usuario actualizado ✓');
    }else{
      const res=await sbPost('app_usuarios',{nombre,username,password,rol});
      usuarios.push(res[0]);
      showToast('Usuario creado ✓');
    }
    closeM('m-u');renderConfig();
  }catch(e){showToast('Error — ese usuario ya existe','err');}
}
async function eliminarUsuario(){
  if(!confirm('¿Eliminar este usuario?'))return;
  try{
    await sbDel('app_usuarios',editUid);
    const idx=usuarios.findIndex(x=>x.id===editUid);if(idx>-1)usuarios.splice(idx,1);
    closeM('m-u');renderConfig();showToast('Usuario eliminado');
  }catch(e){showToast('Error al eliminar','err');}
}

// ── IA CHAT ───────────────────────────────────────────────
function openIA(){
  iaHistory=[];
  $('ia-msgs').innerHTML=`<div class="msg ai">👋 Hola ${CU.nombre}! Soy tu asistente de ProClub. Puedo ayudarte a redactar mensajes, analizar tu negocio, dar consejos de nutrición y entrenamiento. ¿En qué te ayudo hoy?</div>`;
  showScreen('s-ia');
}
function closeIA(){showScreen('s-app');}

function quickMsg(msg){$('ia-inp').value=msg;sendIA();}

async function sendIA(){
  const inp=$('ia-inp');
  const msg=inp.value.trim();if(!msg)return;
  const send=$('ia-send');
  // add user msg
  const msgsEl=$('ia-msgs');
  msgsEl.innerHTML+=`<div class="msg user">${msg}</div>`;
  iaHistory.push({role:'user',content:msg});
  inp.value='';send.disabled=true;
  // loading
  const loadId='ia-load-'+Date.now();
  msgsEl.innerHTML+=`<div class="msg ai loading" id="${loadId}">✦ Pensando...</div>`;
  msgsEl.scrollTop=msgsEl.scrollHeight;
  try{
    const resp=await callClaude(iaHistory);
    iaHistory.push({role:'assistant',content:resp});
    const loadEl=document.getElementById(loadId);
    if(loadEl)loadEl.outerHTML=`<div class="msg ai">${resp.replace(/\n/g,'<br>')}</div>`;
  }catch(e){
    const loadEl=document.getElementById(loadId);
    if(loadEl)loadEl.outerHTML=`<div class="msg ai" style="color:var(--red)">Error de conexión. Intentá de nuevo.</div>`;
  }
  finally{send.disabled=false;msgsEl.scrollTop=msgsEl.scrollHeight;}
}

$('ia-inp').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendIA();}
});

// ── MODAL ─────────────────────────────────────────────────
function openM(id){$(id).classList.add('on');}
function closeM(id){$(id).classList.remove('on');}
document.querySelectorAll('.overlay').forEach(ov=>{
  ov.addEventListener('click',e=>{if(e.target===ov)ov.classList.remove('on');});
});

// ── ARRANCAR ──────────────────────────────────────────────
init();
</script>
</body>
</html>
